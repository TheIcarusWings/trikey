# gitleaks configuration (the "secrets" CI job). The default rules, plus an allowlist for published test
# vectors that look like secrets but are not: they are printed in the BIPs and RFCs they come from.
[extend]
useDefault = true

[allowlist]
description = "Public test vectors used in known-answer tests"
# The known-answer test of the crypto (BIP 32 test vector 1, RFC 4231 HMAC-SHA512, SHA-256("abc"), the
# secp256k1 generator) and its tests. These files hold only published vectors; every other file is
# scanned in full.
paths = [
  '''packages/core/src/random-health\.ts''',
  '''packages/core/test/random-health\.test\.ts''',
  # BIP 352's own send/receive test vectors (silent payments), copied unchanged from the BIP's repository.
  '''packages/silent-payments/test/vectors/send_and_receive_test_vectors\.json''',
  # Published UR test vectors (BlockchainCommons bc-ur test.cpp, BCR-2020-007 HDKey test vector 2).
  '''apps/mobile/src/hardware/qr/ur-vectors\.ts''',
]
regexes = [
  # BIP 32 test vector 1: master and m/0'/1 extended private keys, wherever they are quoted.
  '''xprv9s21ZrQH143K3QTDL4LXw2F7HEK3wJUD2nW2nRk4stbPy6cq3jPPqjiChkVvvNKmPGJxWUtg6LnF5kejMRNNU3TGtRBeJgk33yuGBxrMPHi''',
  '''xprv9wTYmMFdV23N2TdNG573QoEsfRrWKQgWeibmLntzniatZvR9BmLnvSxqu53Kw1UmYPxLgboyZQaXwTCg8MSY3H2EU4pWcQDnRnrVA1xe8fs''',
  # The placeholder wallet id of the approval-text tests: "Trikey policy ... wallet=0123456789abcdef" reads to the
  # generic-api-key rule as a key ("Tri-key") with a value.
  '''^0123456789abcdef$''',
  # A made-up ntfy topic in the notifier's tests (apps/guardian/test/notify-notifier.test.ts): the generic-api-key rule
  # reads "secret of [..., 'owner-topic-x7f3k2'" as a secret with a value.
  '''^owner-topic-x7f3k2$''',
  # The stub that tests refusing a pasted private key in the email certificate pin (guardian-web
  # test/notifications.test.ts): "-----BEGIN PRIVATE KEY-----\nabc\n-----END PRIVATE KEY-----", not a key.
  '''-----BEGIN PRIVATE KEY-----\\nabc\\n-----END PRIVATE KEY-----''',
  # Trikey's publisher public keys, public by design: the founder's from 0.1.28-alpha (hex in site/.well-known/nostr.json,
  # the NIP-05 file) and the retired Trikey key that signed releases up to 0.1.27-alpha (packaging/VERIFY.md's table).
  # The rule reads the name "trikey" as a key ("Tri-key") with a value.
  '''^2ac413fd31b7f60945a22ec4f04f8c907dc210a52c51bfcb64e9a070dc4b979d$''',
  '''^npub19tzp8lf3klmqj3dz9mz0qnuvjp7uyy9993gmljmyaxs8phztj7wsnujvq5$''',
  '''^072104ced2b692c1c7502757f59befb428184086f5c7749c41984bb4beb9a495$''',
  '''^npub1qussfnkjk6fvr36syatltxl0ks5pssyx7hrhf8zpnp9mf04e5j2sswedj9$''',
  # A made-up Telegram bot token in the web page's tests (guardian-web test/notifications.test.ts): the mock refuses
  # tokens starting with 000; no such bot exists.
  '''000000001:AArefused-token-for-the-mock-api-x0''',
  # Encrypted notes (packages/wallet/src/labels-crypto.ts): the HKDF info string "trikey/labels/v1" (a public label, read
  # as a key because the constant's name holds "KEY"), the key material of the test vector made from the throwaway private
  # key 0x11...11, and a made-up second wallet id ("fedcba9876543210") in its tests.
  '''^trikey/labels/v1$''',
  '''^0e45904aea76eede0b7a98612e3235f9e42b1fec3bd1658030f5fb999199482caf3176f968993dc4630296dd0a9c74ecefc6c8e386592e69b9b3f8088a2d9c8f$''',
  '''^fedcba9876543210$''',
  # NIP-06's published test vectors (packages/protocol/test/identity.test.ts): the private keys of its two example mnemonics.
  '''^7f7ff03d123792d6ac594bfa67bf6d0c0ab55b6b1fdb6249303fe861f1ccba9a$''',
  '''^c15d739894c81a2fcfd3a2df85a0d2c0dbc47a280d092799f144d73d7ae78add$''',
  # An expression, not a value (packages/recovery-key/src/wallet.ts, an older commit): `key.xpub === this.s.key2.vault.xpub`.
  '''^this\.s\.key2\.vault\.xpub$''',
]
