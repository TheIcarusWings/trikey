# Dependabot keeps GitHub Actions and npm dependencies up to date.
# Every Actions `uses:` is pinned to a full commit SHA with its version in a trailing comment
# (ci.yml job action-pins fails on anything else); Dependabot updates both the SHA and the comment.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Root lockfile covers the npm workspaces (packages/*, apps/*, e2e).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        update-types:
          - 'minor'
          - 'patch'
      npm-development:
        dependency-type: development
        update-types:
          - 'minor'
          - 'patch'
    commit-message:
      prefix: deps
    ignore:
      # Major bumps need a deliberate PR; Dependabot should not open those automatically.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
