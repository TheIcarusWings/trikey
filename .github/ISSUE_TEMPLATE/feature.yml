name: Feature request
description: Propose a change or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [DESIGN.md](https://github.com/TheIcarusWings/trikey/blob/main/DESIGN.md) and open questions there first.
        Keep proposals small; Trikey is early and moves quickly.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change, and why it fits the threat model.
    validations:
      required: true
