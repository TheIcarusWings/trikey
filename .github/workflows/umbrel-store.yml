name: Umbrel store

# An Umbrel community app store is a repository whose root holds umbrel-app-store.yml
# (packaging/README.md). This monorepo keeps the store under packaging/umbrel/, so on a release
# tag this workflow copies it to its own repository, trikey-umbrel-store, with the image pinned
# by digest: the digest docker.yml's `verified` job let through (pushed by `publish`, rebuilt by
# reproducible.yml). It takes no digest from anyone: it finds the docker.yml run of the tag's
# commit in which `verified` succeeded (.github/scripts/release-run.sh) and uses that run's
# guardian-image-digest artifact. The tag is not re-resolved for the pin; it only has to still
# point at that digest, or the job fails. It runs only on a v* tag ref, in the `release`
# environment (docs/android-signing.md, "The `release` environment").
#
# Only for a published, signed release (docs/design/signed-releases.md): publish-release.yml
# dispatches it once it has published the release, and it checks the release's signature again
# here (packaging/release-signature.py, the publisher key in packaging/release-signer.npub) and
# that the signed compose file pins the very digest it is about to pin. A draft, an unsigned
# release or another digest: no store update. Up to 0.1.26 docker.yml called it while the release
# was still a draft. Run it by hand on the tag to retry.
#
# It needs a secret, UMBREL_STORE_TOKEN: a fine-grained personal access token with
# "Contents: read and write" on the store repository, and nothing else; best kept as a secret of
# the `release` environment, so no other ref can read it. Without the secret the
# workflow does nothing and says so. The store repository's name can be changed with the
# repository variable UMBREL_STORE_REPO (owner/name).

on:
  # On the tag: dispatched by publish-release.yml once the release is published, or by hand to retry. The digest comes
  # from the docker.yml run that verified the tag's commit, never from an input.
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: read # the docker.yml run of the tag's commit, and its digest artifact

jobs:
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    env:
      # Secrets cannot be tested in an `if:`, so the check goes through the environment.
      HAS_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN != '' }}
      STORE_REPO: ${{ vars.UMBREL_STORE_REPO || format('{0}/trikey-umbrel-store', github.repository_owner) }}
      IMAGE: ghcr.io/theicaruswings/trikey-guardian
    steps:
      - name: Check for the store token
        run: |
          if [ "${HAS_TOKEN}" != "true" ]; then
            echo "::notice title=Umbrel store not updated::The UMBREL_STORE_TOKEN secret is not set, so ${GITHUB_REF_NAME} was not copied to ${STORE_REPO}. See packaging/README.md."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_TOKEN == 'true'
        with:
          persist-credentials: false

      - name: Check that the app matches the tag
        if: env.HAS_TOKEN == 'true'
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=packaging/umbrel/trikey-guardian
          grep -Fq "version: \"${version}\"" "${app}/umbrel-app.yml" \
            || { echo "::error::${app}/umbrel-app.yml does not say version \"${version}\""; exit 1; }
          grep -Fq "image: ${IMAGE}:${version}" "${app}/docker-compose.yml" \
            || { echo "::error::${app}/docker-compose.yml does not use ${IMAGE}:${version}"; exit 1; }

      - name: Log in to GHCR
        if: env.HAS_TOKEN == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Before anything else touches the store: the release is published and signed by the publisher key. Every file is
      # downloaded, since the manifest must list exactly the release's files.
      - name: Check the release's signature
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ "$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" = false ] \
            || { echo "::error::${GITHUB_REF_NAME} is not published: the store is updated only for a published, signed release (publish-release.yml dispatches this once it is)."; exit 1; }
          mkdir -p "${RUNNER_TEMP}/release"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir "${RUNNER_TEMP}/release"
          python3 -I packaging/release-signature.py check --tag "${GITHUB_REF_NAME}" --dir "${RUNNER_TEMP}/release" \
            || { echo "::error::${GITHUB_REF_NAME}'s signature does not check (above): the store is not updated."; exit 1; }

      # The run of this commit in which `verified` succeeded.
      - name: The docker.yml run that verified this commit's image
        if: env.HAS_TOKEN == 'true'
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run="$(bash .github/scripts/release-run.sh verified docker.yml verified)"
          IFS=$'\t' read -r id url <<<"${run}"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "The digest of ${url}"

      - name: Download its digest
        if: env.HAS_TOKEN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guardian-image-digest
          path: ${{ runner.temp }}/digest
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The digest `verified` let through, not whatever the tag resolves to now; the tag must still agree with it, and
      # so must the compose file the owner signed.
      - name: Check the image digest
        if: env.HAS_TOKEN == 'true'
        id: digest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          DIGEST="$(tr -d ' \n\r' < "${RUNNER_TEMP}/digest/guardian-image-digest.txt")"
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the verified digest is not a sha256 digest: '${DIGEST}'"; exit 1; }
          signed="$(grep -E '^ *image: *[^ ]*trikey-guardian' "${RUNNER_TEMP}/release/trikey-guardian-compose.yml" || true)"
          [ "${signed}" = "    image: ${IMAGE}:${version}@${DIGEST}" ] \
            || { echo "::error::the signed compose file runs '${signed:-no guardian image}', not ${IMAGE}:${version}@${DIGEST}"; exit 1; }
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" > /dev/null \
            || { echo "::error::${IMAGE}@${DIGEST} does not exist"; exit 1; }
          current=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          [ "${current}" = "${DIGEST}" ] \
            || { echo "::error::${IMAGE}:${version} is ${current}, not the ${DIGEST} docker.yml pushed: the tag was changed"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${version} is ${DIGEST}"

      - name: Check out the store repository
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.UMBREL_STORE_TOKEN }}
          path: store

      - name: Copy the store
        if: env.HAS_TOKEN == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Replace the store's contents with packaging/umbrel/, keeping its own history.
          find store -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -R packaging/umbrel/. store/
          sed -i "s|image: ${IMAGE}:${version}\$|image: ${IMAGE}:${version}@${DIGEST}|" store/trikey-guardian/docker-compose.yml
          grep -F "image: ${IMAGE}:${version}@${DIGEST}" store/trikey-guardian/docker-compose.yml

      - name: Commit and push
        if: env.HAS_TOKEN == 'true'
        working-directory: store
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "The store is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Trikey Guardian ${GITHUB_REF_NAME}" -m "From ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
