name: Site

# Checks site/ before Vercel deploys it to https://trikey.app.
# Vercel deploys on its own from the GitHub repo and runs no build step; see site/README.md.
# The blog's HTML is generated from site/blog/posts/*.md by tools/site/build-blog.mjs and
# committed, so this fails if a post changed without regenerating.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "tools/site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Validate the JSON files
        shell: bash
        run: |
          set -euo pipefail
          # The domain verification files must be valid JSON.
          for f in site/.well-known/apple-app-site-association site/.well-known/assetlinks.json site/vercel.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
            echo "valid JSON: $f"
          done

      # No dependencies: both scripts use only Node's standard library, so no npm ci.
      - name: The blog's generated files match its posts
        run: node tools/site/build-blog.mjs --check

      # Every page: lang, the strict CSP, title, one h1, description and canonical
      # (unless noindex), alt/width/height on images, JSON-LD that parses, links
      # that resolve, and nothing loaded from another site. Links to other sites:
      # only github.com, trikey.app and zapstore.dev, except cited sources in blog posts.
      # sitemap.xml and the feed must be well-formed and complete.
      - name: Check every page
        run: node tools/site/check-site.mjs

      # tools/site/*.test.mjs: node:test, no dependencies (the IndexNow sender's tests, for now).
      - name: Site tool tests
        run: node --test "tools/site/*.test.mjs"

  # After a push to main, once Vercel serves it: tell IndexNow search engines (Bing, Yandex and others; not Google)
  # which pages are new or changed, so a new post is found within a day or two. Sends only what the sitemap says
  # changed (tools/site/indexnow.mjs). The key in site/<key>.txt is public by design, not a secret.
  indexnow:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # The sitemap as it was before this push. A first push (no earlier commit) gives an empty file: every page is new.
      - name: The sitemap before this push
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/before.xml"
          if git fetch --quiet --depth=1 origin "$BEFORE"; then
            git show "$BEFORE:site/sitemap.xml" > "$RUNNER_TEMP/before.xml" || : > "$RUNNER_TEMP/before.xml"
          fi
          echo "before: $(grep -c '<loc>' "$RUNNER_TEMP/before.xml" || true) pages"

      # Vercel deploys on its own. Wait until trikey.app serves this commit's sitemap, so IndexNow never fetches a
      # page that is not live yet. If it can't tell (the site's firewall may refuse a runner), send anyway after 10
      # minutes: the engines fetch the pages themselves, later.
      - name: Wait for Vercel to serve the new sitemap
        shell: bash
        run: |
          set -uo pipefail
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 20 https://trikey.app/sitemap.xml | cmp -s - site/sitemap.xml; then
              echo "trikey.app serves this commit's sitemap"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::trikey.app did not serve this commit's sitemap within 10 minutes; sending anyway"

      - name: Send new and changed pages to IndexNow
        run: node tools/site/indexnow.mjs --before "$RUNNER_TEMP/before.xml" --after site/sitemap.xml
