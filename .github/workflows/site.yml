name: Site

# Checks site/ before Vercel deploys it to https://trikey.app.
# Vercel deploys on its own from the GitHub repo; see site/README.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the site
        shell: bash
        run: |
          set -euo pipefail

          # The domain verification files must be valid JSON.
          for f in site/.well-known/apple-app-site-association site/.well-known/assetlinks.json site/vercel.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
            echo "valid JSON: $f"
          done

          # The page must load nothing from other sites. Links to github.com
          # and to trikey.app itself are the only absolute URLs allowed in
          # src and href attributes.
          bad=$(grep -oE '(src|href)="https?://[^"]*"' site/index.html \
            | grep -vE '="https?://(www\.)?(github\.com|trikey\.app)(/|")' || true)
          if [ -n "$bad" ]; then
            echo "::error file=site/index.html::Disallowed external URL in src/href:"
            echo "$bad"
            exit 1
          fi
          echo "no external references in site/index.html"
