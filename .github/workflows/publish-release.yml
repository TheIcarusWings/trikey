name: Publish release

# The last step of a release: publishes the draft release of a v* tag once every file is attached and checked.
#
# release.yml makes the tag and a draft release, dispatches the builds on the tag (Docker, Reproducible image, Android
# test APK) and then this workflow. The builds attach their files to the draft: the two APKs and their .sha256
# (android-apk.yml), and the compose files with the image pinned by digest (docker.yml, compose-files). A draft is not
# in GitHub's public API, so nobody outside the repository (Obtainium, Zapstore, the app's "Check for updates", someone
# on the releases page) sees the release until this workflow publishes it.
#
# `wait` waits for the newest Docker and Android test APK runs of the tag, which must succeed: found by the tag's commit
# and the jobs only a tag runs, not by name (.github/scripts/release-run.sh). `publish`, in the
# `release` environment (so it runs only on refs the environment allows, after the owner's approval when the
# environment asks for one), checks the draft with packaging/check-release-assets.sh: exactly the expected files, each
# the one GitHub lists, the checksums, both APKs signed by packaging/android/release-cert.sha256 and nothing else and
# each the right app, the compose files byte for byte what docker.yml makes from the tag's packaging/compose with the
# digest it pushed (and its `verified` job found reproduced), and that digest still being what the version tag names,
# and the owner's signature: a manifest of every file signed with Trikey's nostr publisher key, which GitHub never holds
# (packaging/release-signature.py, docs/design/signed-releases.md). The owner signs the draft with
# tools/release/sign-release.mjs before approving; an unsigned draft fails here and stays a draft. Only then is the draft published, and its files
# are compared with what was checked once more after; if they changed, the release goes back to a draft, or, immutable
# (which cannot), is renamed and annotated "withdrawn, do not install", and the run fails. With immutable releases on (docs/android-signing.md, "Immutable
# releases") nothing can change a published release's files or tag afterwards; the job warns while they are off.
#
# It publishes the release as a normal release (not a GitHub pre-release; the version still ends in -alpha) and marks it
# the latest. Then `umbrel-store` dispatches umbrel-store.yml on the tag (when UMBREL_STORE_AUTOPUBLISH is on), which
# checks the published release's signature again before Umbrels are offered the version, and `zapstore-check` dispatches zapstore-check.yml, which waits for Zapstore to publish the version and
# opens an issue if it has not after about three hours (docs/zapstore.md, "Check it after each release").
#
# A tag pushed by hand starts it too (`push`). To retry, re-run its failed jobs, or run it by hand on the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/theicaruswings/trikey-guardian

jobs:
  wait:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read # the builds' runs
      contents: read
    outputs:
      docker-run: ${{ steps.wait.outputs.docker-run }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/release-run.sh
          sparse-checkout-cone-mode: false

      # The runs of the tag's commit (head_sha), started by a push or a dispatch, in which the job that runs only on a
      # v* tag ran (docker.yml's `verified`, android-apk.yml's `release`): never by name, which a branch called like the
      # tag shares (.github/scripts/release-run.sh).
      - name: Wait for the release builds
        id: wait
        run: |
          set -euo pipefail
          # release.yml dispatches the builds just before this workflow: give GitHub a moment to list their runs.
          sleep 30
          deadline=$((SECONDS + 170 * 60))
          while :; do
            pending=""
            for wf in docker.yml android-apk.yml; do
              case "${wf}" in docker.yml) job=verified ;; android-apk.yml) job=release ;; esac
              run="$(bash .github/scripts/release-run.sh newest "${wf}" "${job}")"
              if [ -z "${run}" ]; then pending="${pending} ${wf}(no run yet)"; continue; fi
              IFS=$'\t' read -r id status conclusion url <<<"${run}"
              if [ "${status}" != completed ]; then pending="${pending} ${wf}(${status})"; continue; fi
              if [ "${conclusion}" != success ]; then
                echo "::error title=Release build failed::${wf} for ${TAG} ended ${conclusion}: ${url}. Fix it and re-run it; then re-run this workflow. The release stays a draft."
                exit 1
              fi
              if [ "${wf}" = docker.yml ]; then echo "docker-run=${id}" >> "$GITHUB_OUTPUT"; fi
            done
            if [ -z "${pending}" ]; then
              echo "Docker and Android test APK succeeded for ${TAG}."
              exit 0
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error title=Release builds not done::Still waiting for${pending}. Re-run this workflow once they are done; the release stays a draft."
              exit 1
            fi
            echo "Waiting for${pending}"
            sleep 60
          done

  publish:
    needs: wait
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write # publish the release
      actions: read # the digest artifact of the Docker run
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      # The check script, the pinned certificate and what docker.yml makes the compose files from, from the tag's commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packaging/check-release-assets.sh
            packaging/release-signature.py
            packaging/release-signer.npub
            packaging/android/release-cert.sha256
            packaging/compose/release-compose.sh
            packaging/compose/docker-compose.yml
            packaging/compose/.env.example
            apps/mobile/app.json
          sparse-checkout-cone-mode: false

      # Written by docker.yml's `verified` job: the digest `publish` pushed, which two clean builds reproduced.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guardian-image-digest
          path: ${{ runner.temp }}/digest
          run-id: ${{ needs.wait.outputs.docker-run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find the draft and download its files
        id: draft
        run: |
          set -euo pipefail
          releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq "[.[] | select(.tag_name == \"${TAG}\")]")"
          [ "$(jq length <<<"${releases}")" = 1 ] \
            || { echo "::error::Expected one release for ${TAG}, found $(jq length <<<"${releases}"). Delete the extra drafts (Releases page) and re-run."; exit 1; }
          id="$(jq -r '.[0].id' <<<"${releases}")"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r '.[0].draft' <<<"${releases}")" != true ]; then
            echo "::warning title=Already published::${TAG} is published already: nothing to do."
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/releases/${id}/assets?per_page=100" > "${RUNNER_TEMP}/assets.json"
          mkdir -p "${RUNNER_TEMP}/assets"
          while IFS=$'\t' read -r asset name; do
            [[ "${name}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Unexpected asset name: ${name}"; exit 1; }
            curl -fsSL --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/octet-stream" \
              -o "${RUNNER_TEMP}/assets/${name}" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${asset}"
          done < <(jq -r '.[] | [.id, .name] | @tsv' "${RUNNER_TEMP}/assets.json")
          ls -l "${RUNNER_TEMP}/assets"

      - name: Check every file
        if: steps.draft.outputs.published != 'true'
        run: |
          set -euo pipefail
          DIGEST="$(tr -d ' \n\r' < "${RUNNER_TEMP}/digest/guardian-image-digest.txt")"
          version="${TAG#v}"
          # The version tag must still name that digest: a tag pushed over since is a reason to stop and look.
          current="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')"
          [ "${current}" = "${DIGEST}" ] \
            || { echo "::error::${IMAGE}:${version} is ${current}, not the ${DIGEST} docker.yml pushed: the tag was changed"; exit 1; }
          STANDARD_PACKAGE="$(jq -r '.expo.android.package' apps/mobile/app.json)"
          export DIGEST STANDARD_PACKAGE
          ASSETS_DIR="${RUNNER_TEMP}/assets" ASSETS_JSON="${RUNNER_TEMP}/assets.json" bash packaging/check-release-assets.sh

      - name: Publish
        if: steps.draft.outputs.published != 'true'
        env:
          ID: ${{ steps.draft.outputs.id }}
        run: |
          set -euo pipefail
          # -S on both sides: `gh --jq` (gojq) prints an object's keys sorted, jq in the order written, so the same files
          # would never compare equal as text (0.1.23-alpha's first publish stopped here).
          checked="$(jq -cS '[.[] | {id, name, size, digest}] | sort_by(.name)' "${RUNNER_TEMP}/assets.json")"
          # Right before publishing, the files must still be the ones checked.
          now="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?per_page=100" --jq '[.[] | {id, name, size, digest}] | sort_by(.name)')"
          [ "$(jq -cS . <<<"${now}")" = "${checked}" ] || { echo "::error::The draft's files changed during the check. Re-run this workflow."; exit 1; }
          # What is left: a file swapped between that comparison and this PATCH (a second or so, by a token with
          # contents: write). The comparison after the PATCH catches it; with immutable releases on, the published files
          # cannot change after that.
          # A normal release (not a GitHub pre-release, which Zapstore's indexer skipped), and the latest one.
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" -F draft=false -F prerelease=false -f make_latest=true > "${RUNNER_TEMP}/published.json"
          after="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}/assets?per_page=100" --jq '[.[] | {id, name, size, digest}] | sort_by(.name)')"
          if [ "$(jq -cS . <<<"${after}")" != "${checked}" ]; then
            echo "::error title=Files changed while publishing::${TAG}'s files are not the ones checked."
            # Hide it again: back to a draft, which GitHub allows for a release that is not immutable.
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" -F draft=true > /dev/null; then
              echo "::error title=Release back to draft::${TAG} is a draft again, so nobody outside the repository sees it. Look at its files: delete the release if one is not what the builds made, and release a new version."
              exit 1
            fi
            # An immutable release cannot go back to a draft and its files cannot change, but its title and notes can, and
            # it can stop being the latest: say on the release itself not to install it.
            notes="$(jq -r '.body // ""' "${RUNNER_TEMP}/published.json")"
            warning="**Do not install this release.** Its files changed while it was being published, so they are not the files that were checked (publish-release.yml). It will be deleted; use the next release."
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${ID}" -f name="Trikey ${TAG}: withdrawn, do not install" \
              -f body="$(printf '%s\n\n%s' "${warning}" "${notes}")" -F prerelease=true -f make_latest=false > /dev/null; then
              echo "::error title=Release is public, marked withdrawn::${TAG} could not go back to a draft (immutable), so its title and notes now say not to install it. Delete it now (Releases page, the release, Delete), then release a new version."
            else
              echo "::error title=Release is public and NOT marked::${TAG} could not go back to a draft nor be marked withdrawn. Delete it now (Releases page, the release, Delete), then release a new version."
            fi
            exit 1
          fi
          echo "::notice title=Published::${TAG}: $(jq -r '.html_url' "${RUNNER_TEMP}/published.json")"
          if [ "$(gh api "repos/${GITHUB_REPOSITORY}/releases/${ID}" --jq '.immutable // false')" = true ]; then
            echo "${TAG} is immutable: its files and tag can no longer change."
          else
            echo "::warning title=Release is not immutable::Immutable releases are off, so a token with contents: write can still replace ${TAG}'s files. Turn them on: docs/android-signing.md, \"Immutable releases\"."
          fi

  # The Umbrel store, only once the release is public and signed: umbrel-store.yml (on the tag, in the `release`
  # environment) checks the published release's signature and that its signed compose file pins the digest it is about
  # to pin, then copies the store. Until 0.1.26 docker.yml called it while the release was still a draft. Only when the
  # repository variable UMBREL_STORE_AUTOPUBLISH is `true` (set it with UMBREL_STORE_TOKEN), as before.
  umbrel-store:
    needs: publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && vars.UMBREL_STORE_AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch umbrel-store.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Dispatch the Umbrel store update
        run: |
          set -euo pipefail
          gh workflow run umbrel-store.yml --repo "${GITHUB_REPOSITORY}" --ref "${TAG}"
          echo "::notice title=Umbrel store::Dispatched umbrel-store.yml on ${TAG}: it checks the release's signature, then updates the store (approve the \`release\` environment)."

  # A release published with GITHUB_TOKEN starts no `release:` workflow, but a dispatch does. On main: the check and
  # its script as they are now, whichever tag this run is on. It reads only a public nostr relay and needs no secret.
  zapstore-check:
    needs: publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # dispatch zapstore-check.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Dispatch the Zapstore check
        run: |
          set -euo pipefail
          gh workflow run zapstore-check.yml --repo "${GITHUB_REPOSITORY}" --ref main -f version="${TAG#v}"
          echo "::notice title=Zapstore check::Dispatched zapstore-check.yml for ${TAG#v}: it opens an issue if Zapstore has not published it within about three hours."
