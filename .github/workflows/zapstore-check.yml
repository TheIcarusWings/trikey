name: Zapstore check

# Tells us when Zapstore lags behind a release. Zapstore's indexer is meant to publish each GitHub release by itself
# (docs/zapstore.md), but it did not for months, and nobody noticed until a tester did (zapstore/relay#16).
#
# publish-release.yml dispatches it with the version once the release is published. It asks Zapstore's relay
# (wss://relay.zapstore.dev), read-only, for the release events of Trikey and Trikey FOSS at that version
# (.github/scripts/zapstore-published.mjs), every 10 minutes for about three hours. When both are there it succeeds.
# An event signed by another key than Trikey's publisher npub (Zapstore's indexer may sign with its own) counts too,
# with a notice naming the key. When not, it opens an issue "Zapstore hasn't picked up v<version>" (unless one is open
# already) that says which app is missing and how to publish it by hand, and fails.
#
# No secret: it reads a public relay and writes only an issue, with GITHUB_TOKEN. To check a version again (after
# publishing it by hand, say): Actions, Zapstore check, Run workflow, with the version (0.1.26-alpha).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The released version, without the v (e.g. 0.1.26-alpha).'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zapstore-check-${{ inputs.version }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: read
      issues: write # open the issue when Zapstore lags
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/zapstore-published.mjs
            .nvmrc
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Exit 0: both published. 1: not (both) yet. 2: no answer from the relay. Either of the last two: wait and ask
      # again, until the deadline.
      - name: Wait for Zapstore
        id: wait
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$ ]] || { echo "::error::Expected a version like 0.1.26-alpha, got ${VERSION}"; exit 1; }
          deadline=$((SECONDS + 180 * 60))
          answered=""
          # An app found only under another key than Trikey's: say whose, on the run's summary.
          signers() { sed -n 's/^notice //p' "$1" | while IFS= read -r line; do echo "::notice title=Zapstore signer::${line}"; done; }
          while :; do
            code=0
            node .github/scripts/zapstore-published.mjs "${VERSION}" > "${RUNNER_TEMP}/answer.txt" || code=$?
            cat "${RUNNER_TEMP}/answer.txt"
            if [ "${code}" = 0 ]; then
              signers "${RUNNER_TEMP}/answer.txt"
              echo "::notice title=On Zapstore::Trikey and Trikey FOSS ${VERSION} are published on Zapstore."
              exit 0
            fi
            if [ "${code}" = 1 ]; then cp "${RUNNER_TEMP}/answer.txt" "${RUNNER_TEMP}/answered.txt"; answered=true; fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then break; fi
            sleep 600
          done
          # The apps missing in the last answer; both if the relay never answered.
          if [ -n "${answered}" ]; then
            signers "${RUNNER_TEMP}/answered.txt"
            missing="$(sed -n 's/^missing \([^@]*\)@.*/\1/p' "${RUNNER_TEMP}/answered.txt" | paste -sd ' ' -)"
          else
            missing="app.trikey.wallet app.trikey.wallet.foss"
          fi
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"
          echo "relay-answered=$([ -n "${answered}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "::error title=Not on Zapstore::After three hours Zapstore has not published ${VERSION} of: ${missing}. Publish it by hand: docs/zapstore.md."
          exit 1

      - name: Open an issue
        if: failure() && steps.wait.outputs.missing != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISSING: ${{ steps.wait.outputs.missing }}
          RELAY_ANSWERED: ${{ steps.wait.outputs.relay-answered }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Zapstore hasn't picked up v${VERSION}"
          open="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --limit 200 --json number,title \
            | jq -r --arg t "${title}" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "${open}" ]; then
            echo "Issue #${open} (\"${title}\") is open already: not opening another."
            exit 0
          fi
          {
            echo "Zapstore's relay (\`wss://relay.zapstore.dev\`) has no release event (kind 30063, by any key) for v${VERSION} of:"
            echo
            for app in ${MISSING}; do
              case "${app}" in
                app.trikey.wallet) echo "- Trikey (\`app.trikey.wallet\`)" ;;
                app.trikey.wallet.foss) echo "- Trikey FOSS (\`app.trikey.wallet.foss\`)" ;;
              esac
            done
            echo
            if [ "${RELAY_ANSWERED}" != true ]; then
              echo "(The relay did not answer any of the checks, so it may be down rather than behind.)"
              echo
            fi
            echo "It was checked every 10 minutes for three hours after the GitHub release was published: ${RUN_URL}."
            echo "Zapstore users do not get the update until it is there."
            echo
            echo "Publish it by hand with Trikey's signer, from an up-to-date checkout of main (docs/zapstore.md, \"Check it after each release\"):"
            echo
            echo '```sh'
            echo 'git switch main && git pull'
            for app in ${MISSING}; do
              case "${app}" in
                app.trikey.wallet) echo 'zsp publish zapstore.yaml' ;;
                app.trikey.wallet.foss) echo 'zsp publish packaging/zapstore/foss/zapstore.yaml' ;;
              esac
            done
            echo '```'
            echo
            echo "Then run the Zapstore check again (Actions, Zapstore check, Run workflow, version \`${VERSION}\`) and close this issue."
            echo
            echo "See https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/zapstore.md"
          } > "${RUNNER_TEMP}/issue.md"
          gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${RUNNER_TEMP}/issue.md"
