name: Android test APK

# Builds an installable Android APK of apps/mobile for alpha testers: no Play Store, no Google or
# Apple account. Runs on a manual dispatch and on release tags (v*), never on every push. A tag's APK is
# signed with the project's release key (the ANDROID_RELEASE_KEYSTORE secrets, docs/android-signing.md),
# so releases update each other; a manual run gets a one-off key.
# The test plan that goes with it is docs/alpha-test-plan.md.
#
# The build itself (release build, Hermes bundle, signing, the checks on the APK) is in
# android-build.yml, shared with android-launch.yml, which opens an x86_64 build of the same APK in an
# emulator on every pull request that touches the app. Read that file's header for how and why.
#
# Secrets: GITHUB_TOKEN, and the release key for the build job on tags. Only the release job gets write access.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architectures:
        description: 'CPU architectures to build, comma separated. arm64-v8a is every phone from the last ten years; add x86_64 for an emulator.'
        required: false
        default: 'arm64-v8a'
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: ${{ inputs.architectures || 'arm64-v8a' }}
      artifact-name: trikey-android-apk
      signing: ${{ github.ref_type == 'tag' && 'release' || 'one-off' }}
    secrets:
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

  # Attaches the APK to the tag's release. release.yml creates that release (published pre-release, notes from the
  # CHANGELOG) before dispatching this build, so the APK's own notes (signing, checksum) are appended, not put in their
  # place, and the release stays published. A tag pushed by hand with no release gets a published pre-release.
  release:
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: trikey-android-apk
          path: dist

      - uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: dist/release-notes.md
          append_body: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.apk.sha256
