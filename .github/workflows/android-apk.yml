name: Android test APK

# Builds an installable Android APK of apps/mobile for alpha testers: no Play Store, no Google or
# Apple account, no secrets. Runs on a manual dispatch and on release tags (v*), never on every push.
# The test plan that goes with it is docs/alpha-test-plan.md.
#
# The build itself (release build, Hermes bundle, the one-off signing key, the checks on the APK) is in
# android-build.yml, shared with android-launch.yml, which opens an x86_64 build of the same APK in an
# emulator on every pull request that touches the app. Read that file's header for how and why.
#
# Only GITHUB_TOKEN is used, and only the release job gets write access.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architectures:
        description: 'CPU architectures to build, comma separated. arm64-v8a is every phone from the last ten years; add x86_64 for an emulator.'
        required: false
        default: 'arm64-v8a'
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: ${{ inputs.architectures || 'arm64-v8a' }}
      artifact-name: trikey-android-apk

  # A draft prerelease: nothing is public until the owner looks at it and publishes it.
  release:
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: trikey-android-apk
          path: dist

      - uses: softprops/action-gh-release@v2.6.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Trikey ${{ github.ref_name }} (alpha test build)
          body_path: dist/release-notes.md
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.apk.sha256
