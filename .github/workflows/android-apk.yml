name: Android test APK

# Builds the installable Android APKs of apps/mobile for alpha testers: no Play Store, no Google or
# Apple account. Runs on a manual dispatch and on release tags (v*), never on every push. Two APKs, two apps from the
# same code: the standard build (app.trikey.wallet, trikey-alpha-<tag>.apk) and the one without Google code
# (app.trikey.wallet.foss, trikey-alpha-foss-<tag>.apk); android-build.yml's header says what differs. A tag's APKs are
# both signed with the project's release key (the ANDROID_RELEASE_KEYSTORE secrets, docs/android-signing.md), so each
# release updates the same app of the previous one; a manual run gets a one-off key per APK.
# The test plan that goes with it is docs/alpha-test-plan.md.
#
# The build itself (release build, Hermes bundle, signing, the checks on the APK) is in
# android-build.yml, shared with android-launch.yml, which opens an x86_64 build of the same APK in an
# emulator on every pull request that touches the app. Read that file's header for how and why.
#
# Secrets: GITHUB_TOKEN, and the release key, only on release tags (v*): the apk-release job passes it, and inside
# android-build.yml only the `sign` job, in the `release` environment, reads it. A run on a branch has two separate jobs
# with no `secrets:` at all, so a branch dispatch never gets the key. Only the release job gets write access.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architectures:
        description: 'CPU architectures to build, comma separated. arm64-v8a is every phone from the last ten years; add x86_64 for an emulator.'
        required: false
        default: 'arm64-v8a'
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual runs on a branch: a one-off key per APK, and no secrets at all. (A tag that is not v* lands here too.)
  apk:
    if: ${{ !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) }}
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, foss]
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: ${{ inputs.architectures || 'arm64-v8a' }}
      artifact-name: trikey-android-apk-${{ matrix.variant }}
      signing: one-off
      variant: ${{ matrix.variant }}

  # Release tags (v*) only: the release key. android-build.yml hands it to its `sign` job alone, which declares the
  # `release` environment; once the key is an environment secret there (docs/android-signing.md), the repository
  # secrets passed here can be deleted and the environment's deployment rule decides which refs ever get it.
  apk-release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    strategy:
      # Both or no release: the release job below needs both builds.
      fail-fast: false
      matrix:
        variant: [standard, foss]
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: ${{ inputs.architectures || 'arm64-v8a' }}
      artifact-name: trikey-android-apk-${{ matrix.variant }}
      signing: release
      variant: ${{ matrix.variant }}
    secrets:
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

  # Attaches both APKs to the tag's release while it is a draft. release.yml creates that draft (notes from the
  # CHANGELOG) before dispatching this build, so the APKs' own notes (signing, which APK to pick, checksums) are
  # appended, not put in their place; for a tag pushed by hand, this job or docker.yml's compose-files makes the draft. The release is
  # published by publish-release.yml, once every asset is there and checked; a release that is published already is
  # never changed (assets of a published release are what people, Obtainium, Zapstore and the app's update check have
  # trusted). Before anything is uploaded, every APK's signing certificate is checked again here against
  # packaging/android/release-cert.sha256, and every checksum file against its APK.
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: apk-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/android
          sparse-checkout-cone-mode: false

      # By exact name: a pattern like trikey-android-apk-* would also match the build jobs' -unsigned artifacts
      # (android-build.yml), and the checks below expect exactly the two signed APKs.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trikey-android-apk-standard
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trikey-android-apk-foss
          path: dist

      # The parts each build wrote (packaging/android/apk-release-notes.sh): what both share, then each APK.
      - name: Put the release notes together
        run: |
          set -euo pipefail
          for part in common standard foss; do
            [ -s "dist/release-notes-${part}.md" ] || { echo "::error::dist/release-notes-${part}.md is missing"; exit 1; }
          done
          cat dist/release-notes-common.md dist/release-notes-standard.md dist/release-notes-foss.md > dist/release-notes.md
          ls -l dist
          [ "$(ls dist/*.apk | wc -l)" = 2 ] || { echo "::error::Expected two APKs"; exit 1; }

      # The signing job checked this already; this is the last look before upload, in the job that uploads, so an APK
      # signed by any other key (or a stray unsigned one) never reaches the release.
      - name: Check every APK's certificate against the pinned release certificate
        run: |
          set -euo pipefail
          bt="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          [ -x "${bt}/apksigner" ] || { echo "::error::No apksigner under ${ANDROID_HOME}/build-tools"; exit 1; }
          pinned="$(grep -v '^#' packaging/android/release-cert.sha256 | tr -d ' :\n\r' | tr 'A-F' 'a-f')"
          [[ "${pinned}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::packaging/android/release-cert.sha256 does not hold a SHA-256"; exit 1; }
          shopt -s nullglob
          apks=(dist/*.apk)
          [ "${#apks[@]}" = 2 ] || { echo "::error::Expected two APKs, found ${#apks[@]}"; exit 1; }
          for apk in "${apks[@]}"; do
            certs="$("${bt}/apksigner" verify --verbose --print-certs "${apk}")"
            digests="$(grep -oiE 'certificate SHA-256 digest: *[0-9a-f:]+' <<<"${certs}" | sed -E 's/.*[Dd]igest: *//' | tr -d ':' | tr 'A-F' 'a-f' | sort -u)"
            [ "${digests}" = "${pinned}" ] \
              || { echo "::error::${apk} is signed by ${digests:-nothing}, not by the release key ${pinned}"; exit 1; }
            (cd dist && sha256sum -c "$(basename "${apk}").sha256")
            echo "${apk}: release key ${pinned}, checksum file matches"
          done

      # gh finds a draft by its tag too. --clobber only ever replaces a draft's files: a published release is refused.
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # A tag pushed by hand. `|| true`: docker.yml may make it at the same moment; the view below decides.
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --verify-tag \
              --title "Trikey ${TAG}" --notes "Trikey ${TAG}." || true
          fi
          draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [ "${draft}" = "true" ]; then
            body="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
            # Once: a re-run (redispatch) must not add the notes a second time.
            if ! grep -qF '## Trikey alpha test build (Android)' <<<"${body}"; then
              { printf '%s\n\n' "${body}"; cat dist/release-notes.md; } > "${RUNNER_TEMP}/notes.md"
              gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file "${RUNNER_TEMP}/notes.md"
            fi
          fi
          if [ "${draft}" != "true" ]; then
            echo "::warning title=Release already published::${TAG} is published, so its APKs are not replaced. A new build is a new release."
            exit 0
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber dist/*.apk dist/*.apk.sha256
          echo "::notice title=APKs attached to the draft::${TAG}: $(cd dist && echo *.apk). publish-release.yml publishes the release once every asset is checked."
