name: Android test APK

# Builds the installable Android APKs of apps/mobile for alpha testers: no Play Store, no Google or
# Apple account. Runs on a manual dispatch and on release tags (v*), never on every push. Two APKs, the same
# app: the standard build and the one without Google code (trikey-alpha-<tag>.apk and trikey-alpha-foss-<tag>.apk;
# android-build.yml's header says what differs). A tag's APKs are both signed with the project's release key (the
# ANDROID_RELEASE_KEYSTORE secrets, docs/android-signing.md), so releases update each other and a phone can move
# from one build to the other; a manual run gets a one-off key per APK.
# The test plan that goes with it is docs/alpha-test-plan.md.
#
# The build itself (release build, Hermes bundle, signing, the checks on the APK) is in
# android-build.yml, shared with android-launch.yml, which opens an x86_64 build of the same APK in an
# emulator on every pull request that touches the app. Read that file's header for how and why.
#
# Secrets: GITHUB_TOKEN, and the release key for the build job on tags. Only the release job gets write access.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      architectures:
        description: 'CPU architectures to build, comma separated. arm64-v8a is every phone from the last ten years; add x86_64 for an emulator.'
        required: false
        default: 'arm64-v8a'
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    strategy:
      # Both or no release: the release job below needs both builds.
      fail-fast: false
      matrix:
        variant: [standard, foss]
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: ${{ inputs.architectures || 'arm64-v8a' }}
      artifact-name: trikey-android-apk-${{ matrix.variant }}
      signing: ${{ github.ref_type == 'tag' && 'release' || 'one-off' }}
      variant: ${{ matrix.variant }}
    secrets:
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}

  # Attaches both APKs to the tag's release. release.yml creates that release (published pre-release, notes from the
  # CHANGELOG) before dispatching this build, so the APKs' own notes (signing, which APK to pick, checksums) are
  # appended, not put in their place, and the release stays published. A tag pushed by hand with no release gets a
  # published pre-release.
  release:
    if: github.ref_type == 'tag'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: trikey-android-apk-*
          merge-multiple: true
          path: dist

      # The parts each build wrote (android-build.yml, "Release notes"): what both share, then each APK.
      - name: Put the release notes together
        run: |
          set -euo pipefail
          for part in common standard foss; do
            [ -s "dist/release-notes-${part}.md" ] || { echo "::error::dist/release-notes-${part}.md is missing"; exit 1; }
          done
          cat dist/release-notes-common.md dist/release-notes-standard.md dist/release-notes-foss.md > dist/release-notes.md
          ls -l dist
          [ "$(ls dist/*.apk | wc -l)" = 2 ] || { echo "::error::Expected two APKs"; exit 1; }

      - uses: softprops/action-gh-release@v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: dist/release-notes.md
          append_body: true
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.apk.sha256
