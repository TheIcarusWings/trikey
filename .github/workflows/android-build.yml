name: Android APK build

# The build half of the Android test APK, as a reusable workflow so the release build and the launch check
# make the APK with the very same steps:
#
# - android-apk.yml (tags and manual dispatch) calls it for arm64-v8a, the phones testers use, once per variant,
#   and attaches both APKs to the release;
# - android-launch.yml (pull requests) calls it for x86_64, the emulator's ABI, and opens the APK in an
#   Android emulator to check it starts.
#
# Two variants (`variant`, TRIKEY_ANDROID_VARIANT; apps/mobile/android-variant.js explains them), two apps with the same
# code and signature but their own application id, launcher label and URL scheme, so both can be installed on one phone:
#
# - `standard`: app.trikey.wallet ("Trikey"), trikey-alpha-<version>.apk. Has Google's libraries: Google Sign-In for Google Drive backup (off until
#   EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID is set), ML Kit for reading QR codes, the Play services passkey provider.
# - `foss`: app.trikey.wallet.foss ("Trikey FOSS"), trikey-alpha-foss-<version>.apk, no Google code. QR codes are read by zxing-cpp (open source); there is
#   no Google Drive. A check fails the build if any Google Play services, Firebase, ML Kit or data transport class,
#   or ML Kit's libbarhopper, is in the APK (apps/mobile/scripts/apk-google-scan.mts); for the standard APK the same
#   check only reports what is there.
#
# The build is in its own file, not a `workflow_call` trigger on android-apk.yml, because a called workflow
# cannot ask for more than its caller has: android-apk.yml's release job needs `contents: write`, which a
# pull-request check must not hand out.
#
# Release, not debug. A debug build loads its JavaScript from Metro on a computer and starts in Demo
# mode (`__DEV__`); a release build has the Hermes bundle embedded, needs nothing running next to it
# and starts in Real mode, which is what a tester wants. Settings, Developer (wallet mode, crypto
# self-test) is an ordinary screen of the app, not part of React Native's dev menu, so it is there in
# a release build too.
#
# Signing. Expo's generated project signs release builds with its public debug keystore, so the job
# re-signs the APK, in one of two ways (`signing`):
#
# - `release` (release tags): with the project's release key, from the ANDROID_RELEASE_KEYSTORE secrets
#   (docs/android-signing.md). Every release has the same signature, so Android installs one over the
#   other and the wallet on the phone stays. The key never is in the repository; its certificate's
#   SHA-256 is, in packaging/android/release-cert.sha256, and the job refuses an APK signed by anything else.
# - `one-off` (pull requests, manual runs): with a throwaway key made in the job (keytool, random password,
#   deleted at the end, never uploaded). Such a build cannot update, or be updated by, any other build.
#
# Cleartext: not allowed. Android 9+ blocks plain http:// and ws:// for a release build unless the
# manifest asks for it, and real mode on signet or testnet4 uses public wss:// relays. A relay on a
# home network (ws://192.168...) is only for the regtest simulator; see docs/alpha-test-plan.md.
#
# Native identifiers come from the environment, as in apps/mobile/README.md ("Publishing your own
# build"): iCloud off, passkeys off (no EXPO_PUBLIC_PASSKEY_RP_ID), Google Drive backup off (no
# EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID). Backup is the recovery code plus a backup file.
#
# Only read access. Secrets: the release key, and only when the caller passes it (android-apk.yml, on tags).

on:
  workflow_call:
    inputs:
      architectures:
        description: 'CPU architectures to build, comma separated (arm64-v8a for phones, x86_64 for an emulator).'
        required: false
        default: 'arm64-v8a'
        type: string
      artifact-name:
        description: 'Name of the uploaded artifact (the APK, its .sha256 file and its part of the release notes).'
        required: false
        default: 'trikey-android-apk'
        type: string
      signing:
        description: "'release' (the project's release key, from the secrets below) or 'one-off' (a throwaway key)."
        required: false
        default: 'one-off'
        type: string
      variant:
        description: "'standard' (with Google's libraries) or 'foss' (no Google code). See the header."
        required: false
        default: 'standard'
        type: string
    secrets:
      ANDROID_RELEASE_KEYSTORE:
        description: 'The release keystore (PKCS12), base64. Needed for signing: release.'
        required: false
      ANDROID_RELEASE_KEYSTORE_PASSWORD:
        description: 'Its password (the key has the same one).'
        required: false
      ANDROID_RELEASE_KEY_ALIAS:
        description: "The key's alias in the keystore. Default: trikey."
        required: false
    outputs:
      apk-name:
        description: 'File name of the signed APK in the artifact, without .apk'
        value: ${{ jobs.apk.outputs.apk-name }}
      application-id:
        description: "The Android application id (android.package in the Expo config). It differs per variant: a matrix caller gets only one job's, so the artifact also holds it, in application-id-<variant>.txt."
        value: ${{ jobs.apk.outputs.application-id }}

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      apk-name: ${{ steps.sign.outputs.name }}
      application-id: ${{ steps.config.outputs.application-id }}
    env:
      # Expo reads these when it generates the native project. Empty on purpose: see the header.
      TRIKEY_DISABLE_ICLOUD: '1'
      EXPO_PUBLIC_PASSKEY_RP_ID: ''
      EXPO_PUBLIC_GOOGLE_OAUTH_CLIENT_ID: ''
      # Read by app.config.ts and the config plugin at the prebuild, and by linking, Metro and the app config during
      # the Gradle build (the generated project stops if they differ): set once, for the whole job.
      TRIKEY_ANDROID_VARIANT: ${{ inputs.variant || 'standard' }}
      # Through the environment, not spliced into a script.
      ARCHITECTURES: ${{ inputs.architectures || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Command-line tools and licences. Gradle then fetches the platform, build tools, NDK and CMake
      # that this React Native version asks for.
      - uses: android-actions/setup-android@v4.0.4

      - name: Check the variant
        run: |
          case "${TRIKEY_ANDROID_VARIANT}" in
            standard|foss) echo "Building the ${TRIKEY_ANDROID_VARIANT} variant" ;;
            *) echo "::error::Unknown variant: ${TRIKEY_ANDROID_VARIANT} (standard or foss)"; exit 1 ;;
          esac

      - run: npm ci

      # The application id the build will have: android.package from app.json, as app.config.ts resolves it for this
      # variant (app.trikey.wallet, or app.trikey.wallet.foss for foss; TRIKEY_ANDROID_PACKAGE overrides the first for a
      # fork). The APK is checked against it below, and the launch check starts the app by it
      # (application-id-<variant>.txt in the artifact).
      - name: Read the application id from the Expo config
        id: config
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          id="$(npx expo config --type public --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).android?.package;if(!p)process.exit(1);process.stdout.write(p)})')"
          [[ "${id}" =~ ^[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+$ ]] || { echo "::error::Unexpected android.package: ${id}"; exit 1; }
          case "${TRIKEY_ANDROID_VARIANT}" in
            foss) [[ "${id}" == *.foss ]] || { echo "::error::The foss build's application id must end in .foss, not ${id}"; exit 1; } ;;
            *) [[ "${id}" != *.foss ]] || { echo "::error::The standard build has the foss application id ${id}"; exit 1; } ;;
          esac
          echo "Application id: ${id}"
          echo "application-id=${id}" >> "${GITHUB_OUTPUT}"

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # After the prebuild, so the cache key sees the generated Gradle files.
      # Write the cache on any ref (the default only writes on the default branch): tags never are.
      - uses: gradle/actions/setup-gradle@v5.0.2
        with:
          cache-read-only: false

      - name: Build the release APK
        working-directory: apps/mobile/android
        run: |
          [[ "${ARCHITECTURES}" =~ ^[a-z0-9_,-]+$ ]] || { echo "::error::Unexpected architectures: ${ARCHITECTURES}"; exit 1; }
          # Minifying (R8) is switched off for a test build: it shrinks nothing a tester needs, and a
          # stripped class in a crypto or Bluetooth library would look like a wallet bug.
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures="${ARCHITECTURES}" \
            -Pandroid.enableMinifyInReleaseBuilds=false

      - name: Sign and check the result
        id: sign
        env:
          UNSIGNED: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          APPLICATION_ID: ${{ steps.config.outputs.application-id }}
          SIGNING: ${{ inputs.signing || 'one-off' }}
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bt="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n 1)"
          bt="${bt%/}"

          # The names the app's update check looks for (apps/mobile/src/lib/update-check.ts, assetNames).
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${TRIKEY_ANDROID_VARIANT}" = foss ]; then
            name="trikey-alpha-foss-${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="trikey-alpha-${GITHUB_REF_NAME}"
          elif [ "${TRIKEY_ANDROID_VARIANT}" = foss ]; then
            name="trikey-alpha-foss-0.1.0-${GITHUB_SHA::7}"
          else
            name="trikey-alpha-0.1.0-${GITHUB_SHA::7}"
          fi

          keystore="${RUNNER_TEMP}/signing.p12"
          case "${SIGNING}" in
            release)
              # The project's release key. A release is never signed with anything else: without the secrets,
              # or without the pinned certificate, the job stops instead of falling back to a one-off key.
              [ -n "${RELEASE_KEYSTORE}" ] && [ -n "${RELEASE_PASS}" ] \
                || { echo "::error::signing: release, but the ANDROID_RELEASE_KEYSTORE secrets are not set (docs/android-signing.md)"; exit 1; }
              [ -s packaging/android/release-cert.sha256 ] \
                || { echo "::error::signing: release, but packaging/android/release-cert.sha256 is missing"; exit 1; }
              base64 -d <<<"${RELEASE_KEYSTORE}" > "${keystore}" \
                || { echo "::error::ANDROID_RELEASE_KEYSTORE is not valid base64"; exit 1; }
              # A secret set from a pipe (`security find-generic-password -w | gh secret set ...`) can keep the
              # line break the command printed at the end: it is not part of the password.
              KS_PASS="${RELEASE_PASS%%[$'\r\n']*}"
              alias="${RELEASE_ALIAS:-trikey}"
              ;;
            one-off)
              # A key that exists for this job only: random password (masked), never written to the repository,
              # the artifact or a secret store, and deleted below.
              KS_PASS="$(openssl rand -hex 24)"
              echo "::add-mask::${KS_PASS}"
              alias=trikey-test
              keytool -genkeypair -keystore "${keystore}" -storetype PKCS12 \
                -alias "${alias}" -keyalg RSA -keysize 3072 -validity 3650 \
                -dname "CN=Trikey one-off test key, O=Trikey alpha test build" \
                -storepass "${KS_PASS}" -keypass "${KS_PASS}"
              ;;
            *) echo "::error::Unknown signing: ${SIGNING}"; exit 1 ;;
          esac
          export KS_PASS

          # apksigner replaces the debug signature Gradle put on the APK.
          "${bt}/apksigner" sign --ks "${keystore}" --ks-type PKCS12 --ks-key-alias "${alias}" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "dist/${name}.apk" "${UNSIGNED}"
          rm -f "${keystore}"
          unset KS_PASS RELEASE_PASS RELEASE_KEYSTORE

          # Checks: aligned, signed by the expected key and not the public debug key, the right app, the
          # native code for every architecture asked for, and a JavaScript bundle inside (so it runs
          # without Metro).
          "${bt}/zipalign" -c 4 "dist/${name}.apk"
          certs="$("${bt}/apksigner" verify --verbose --print-certs "dist/${name}.apk")"
          echo "${certs}"
          if grep -qi 'Android Debug' <<<"${certs}"; then echo "::error::The APK is still signed with the debug key"; exit 1; fi
          # The signers' certificate digests, however this apksigner labels the lines ("Signer #1 ...", or per scheme or
          # SDK range in other versions): every one must be the same certificate.
          digests="$(grep -oiE 'certificate SHA-256 digest: *[0-9a-f:]+' <<<"${certs}" | sed -E 's/.*[Dd]igest: *//' | tr -d ':' | tr 'A-F' 'a-f' | sort -u)"
          if [ -z "${digests}" ] || [ "$(wc -l <<<"${digests}")" != 1 ]; then
            report="$(head -n 40 <<<"${certs}" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error::Could not read exactly one signing certificate digest from apksigner (found: ${digests:-none}). Its report:%0A${report}"
            exit 1
          fi
          signer="${digests}"
          if [ "${SIGNING}" = release ]; then
            pinned="$(grep -v '^#' packaging/android/release-cert.sha256 | tr -d ' :\n\r' | tr 'A-F' 'a-f')"
            [[ "${pinned}" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::packaging/android/release-cert.sha256 does not hold a SHA-256"; exit 1; }
            [ "${signer}" = "${pinned}" ] \
              || { echo "::error::The APK is signed by ${signer}, not by the release key ${pinned} (packaging/android/release-cert.sha256)"; exit 1; }
          else
            grep -q 'Trikey one-off test key' <<<"${certs}" || { echo "::error::The APK is not signed with the one-off key"; exit 1; }
          fi
          echo "signer=${signer}" >> "${GITHUB_OUTPUT}"
          # (Captured first: a pipe into grep -q would end the writer early and trip pipefail.)
          badging="$("${bt}/aapt2" dump badging "dist/${name}.apk")"
          grep -qF "package: name='${APPLICATION_ID}'" <<<"${badging}" \
            || { echo "::error::Unexpected package name (expected ${APPLICATION_ID})"; exit 1; }
          listing="$(unzip -l "dist/${name}.apk")"
          grep -q 'assets/index.android.bundle' <<<"${listing}" \
            || { echo "::error::No embedded JavaScript bundle: this build would need Metro"; exit 1; }
          IFS=',' read -ra abis <<<"${ARCHITECTURES}"
          for abi in "${abis[@]}"; do
            grep -q "lib/${abi}/" <<<"${listing}" ||{ echo "::error::No native libraries for ${abi} in the APK"; exit 1; }
          done

          (cd dist && sha256sum "${name}.apk" > "${name}.apk.sha256")
          # For the launch check, which runs once per variant and cannot tell the two jobs' outputs apart.
          printf '%s\n' "${APPLICATION_ID}" > "dist/application-id-${TRIKEY_ANDROID_VARIANT}.txt"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "sha256=$(cut -d' ' -f1 "dist/${name}.apk.sha256")" >> "${GITHUB_OUTPUT}"
          echo "size=$(stat -c %s "dist/${name}.apk")" >> "${GITHUB_OUTPUT}"

      # Every dex file (any class of these packages, or any mention of one), the native libraries, the files Google's
      # libraries leave at the APK's root and the manifest. The FOSS APK must have none of it; the standard APK's
      # findings are only reported, as a notice.
      - name: Check for Google code
        env:
          APK: dist/${{ steps.sign.outputs.name }}.apk
        run: |
          set -euo pipefail
          if [ "${TRIKEY_ANDROID_VARIANT}" = foss ]; then
            if ! report="$(node --import tsx apps/mobile/scripts/apk-google-scan.mts "${APK}" --require-none)"; then
              echo "${report}"
              echo "::error title=Google code in the FOSS APK::$(sed 's/%/%25/g' <<<"${report}" | awk '{printf "%s%%0A", $0}')"
              exit 1
            fi
            echo "${report}"
            echo "::notice title=No Google code::${report}"
          else
            report="$(node --import tsx apps/mobile/scripts/apk-google-scan.mts "${APK}")"
            echo "${report}"
            echo "::notice title=Google code in the standard APK (expected)::$(head -n 12 <<<"${report}" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          {
            echo "### Google code check (${TRIKEY_ANDROID_VARIANT})"
            echo '```'
            echo "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The release notes, in parts that android-apk.yml puts together for the release, in this order:
      # - release-notes-common.md (written by the standard build): signing, which of the two APKs to pick, how to install;
      # - release-notes-<variant>.md (each build): the APK's name, checksum, size and what it was built from.
      - name: Release notes
        env:
          NAME: ${{ steps.sign.outputs.name }}
          SHA256: ${{ steps.sign.outputs.sha256 }}
          SIGNER: ${{ steps.sign.outputs.signer }}
          SIZE: ${{ steps.sign.outputs.size }}
          SIGNING: ${{ inputs.signing || 'one-off' }}
        run: |
          set -euo pipefail
          if [ "${SIGNING}" = release ]; then
            signing_note="**Signed with the Trikey release key** (certificate SHA-256 \`${SIGNER}\`, also in
          packaging/android/release-cert.sha256). Every release from 0.1.7-alpha on has this signature, so it installs over
          the previous one and the wallet on the phone stays. Builds up to 0.1.6-alpha had one-off keys: moving from one of
          those needs a last uninstall, which deletes the wallet on that phone, so make a backup (recovery code and backup
          file) first. To get updates without downloading by hand, see docs/android-signing.md (Obtainium)."
          else
            signing_note="**This is a test build, signed with a one-off key made by the build job.** The key is thrown away
          after the build, so Android will not install this build over another one, or another over it: uninstall first.
          Uninstalling deletes the wallet on that phone, so make a backup (recovery code and backup file) before you do."
          fi
          # Both APK names, whichever variant this job built.
          standard_name="${NAME/trikey-alpha-foss-/trikey-alpha-}"
          foss_name="${standard_name/trikey-alpha-/trikey-alpha-foss-}"
          size_mb="$(awk -v b="${SIZE}" 'BEGIN { printf "%.1f", b / 1048576 }')"

          if [ "${TRIKEY_ANDROID_VARIANT}" = standard ]; then
            cat > dist/release-notes-common.md <<EOF
          ## Trikey alpha test build (Android)

          ${signing_note}

          **Which APK?** There are two builds of the same code, as two apps: each updates itself, and both can be on one
          phone, each with its own wallet.

          - \`${standard_name}.apk\`: the **standard** build, "Trikey" (app.trikey.wallet). It contains Google's
            libraries: QR codes are read with Google's ML Kit, and Google Drive backup can be switched on in a later release
            (it needs Google Play services on the phone).
          - \`${foss_name}.apk\`: **no Google code**, "Trikey FOSS" (app.trikey.wallet.foss), for phones without Google
            Play services (GrapheneOS, /e/OS, LineageOS) or if you prefer an app without it. QR codes are read with the
            open source zxing-cpp. It will never offer Google Drive backup: the backup is the recovery code plus the backup
            file, which you can still save to Google Drive or anywhere else from the share sheet. Settings, About says
            "Trikey (no Google)".

          Today both do the same: Google Drive backup is not switched on in either yet. Not sure? Take the standard one.

          **Had the no-Google APK of 0.1.21-alpha or earlier?** It had the standard app's id, so this FOSS APK cannot
          update it: it installs as a second app, next to the old one, and starts empty. Your wallet is still in the old
          app. In Trikey FOSS, tap "I already have a Trikey wallet", then "My phone, but I have its backup", and open your
          backup file with your recovery code. Uninstall the old app once the wallet shows in the new one. (Or install
          the standard APK over the old app: it updates in place and keeps the wallet, with Google's libraries.)

          - Pre-alpha, open source, not audited. Test networks only (signet, testnet4). Never put real bitcoin in it.
          - Install: download the APK on the phone, open it, and allow installing from this source when Android asks.
          - Passkeys and Google Drive backup are not in these builds; the backup is a recovery code plus a backup file.
          - Check for updates (Settings, About) offers the APK of the build you have installed.
          - How to test it: docs/alpha-test-plan.md in the repository.
          EOF
          fi

          if [ "${TRIKEY_ANDROID_VARIANT}" = foss ]; then
            heading="No Google: \`${NAME}.apk\`"
            checked="- Checked by the build: no Google Play services, Firebase, ML Kit or data transport code in it."
          else
            heading="Standard: \`${NAME}.apk\`"
            checked=""
          fi
          cat > "dist/release-notes-${TRIKEY_ANDROID_VARIANT}.md" <<EOF

          ### ${heading}

          - SHA-256 \`${SHA256}\`
          - ${size_mb} MB, built for ${ARCHITECTURES} from commit ${GITHUB_SHA::12}.
          ${checked}
          EOF
          cat dist/release-notes-*.md >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ inputs.artifact-name || 'trikey-android-apk' }}
          path: |
            dist/*.apk
            dist/*.apk.sha256
            dist/release-notes-*.md
            dist/application-id-*.txt
          if-no-files-found: error
          retention-days: 30
