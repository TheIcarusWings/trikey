name: Docker

# Release tags (v*) build and push the guardian image (amd64 + arm64, since Umbrel runs on Raspberry Pi), then attach
# the compose files to the release and pack the Umbrel store and the Start9 package from the digest just pushed.
# Everything else (pull requests, manual runs on a branch) builds the same image and pushes nothing.
#
# Only the `publish` job can write to GHCR (`packages: write`), and it runs only on a v* tag ref; it also declares the
# `release` environment, so once the owner restricts that environment to v* tags (docs/android-signing.md, "The
# `release` environment") a dispatch on any other ref cannot even start it. It pushes with GHCR_PUSH_TOKEN, a secret of
# that environment, when the owner has set one up; until then with GITHUB_TOKEN, and it says so in a warning, because
# any workflow on any branch can ask for a GITHUB_TOKEN that may write the package (docs/android-signing.md, "The
# image": how to close that).
#
# One tag per release, `<version>` (0.1.22-alpha), and no moving tag (no `latest`, `<major>.<minor>` or `sha-...`):
# nothing points at a tag that later releases would move, so there is no tag whose overwriting would reach anyone who
# did not ask for that exact version. A version tag can still be pushed over by a token that may write the package, which
# is why everything this repository ships names the image by digest (the release's compose file, the Umbrel store, the
# Start9 package's packed image) and only development files name the tag. A re-run of a release must push the very
# same digest (the build is reproducible); if the version is on GHCR already with another digest, `publish` fails.
#
# Downstream of the push, nothing re-resolves the tag: compose-files, start9.yml and umbrel-store.yml are given the
# digest `publish` pushed, and start9.yml and umbrel-store.yml fail if the tag no longer points at it. They get it only
# through `verified`: on a release tag this workflow also calls reproducible.yml, which builds the same commit twice
# more from nothing, and `verified` lets the digest through only if those builds give exactly the pushed image index.
# release.yml therefore dispatches this workflow and android-apk.yml (and publish-release.yml); reproducible.yml,
# start9.yml and umbrel-store.yml run from here.
#
# The image is built to be reproducible: see packaging/VERIFY.md, and
# .github/workflows/reproducible.yml, which builds it twice and compares the digests.
#
# arm64 is built under QEMU, on the amd64 runner, from a binfmt image pinned by digest (BINFMT_IMAGE). Not natively on
# an arm64 runner with the two platforms merged afterwards: the merged index would be written by `imagetools create`,
# not by BuildKit's exporter, so its digest would no longer be the one a single multi-platform build gives, which is what
# reproducible.yml compares and what packaging/VERIFY.md tells everyone to rebuild and compare.
# The two workflows must build the same way, so keep these in step with that file:
#   - the pinned BuildKit (driver-opts below),
#   - SOURCE_DATE_EPOCH and VERSION as build args,
#   - rewrite-timestamp=true on the exporter,
#   - no provenance or SBOM attestations (they record the build, and so differ per build),
#   - no `org.opencontainers.image.created` label (docker/metadata-action would add the
#     current time), which is why the tag is written out here and no metadata step is used.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/theicaruswings/trikey-guardian
  # BuildKit v0.34.1, by digest (moby/buildkit on Docker Hub, 2026-10-29). Same as reproducible.yml.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  # The QEMU emulators for the arm64 build: setup-qemu-action runs this image with --privileged, so it is pinned by
  # digest (tonistiigi/binfmt on Docker Hub, tag qemu-v10.2.3-68, 2026-06-08; the image index) and never taken from the
  # Actions cache. Same as reproducible.yml and packaging/VERIFY.md.
  BINFMT_IMAGE: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  # Pull requests and manual runs on a branch: both platforms, nothing pushed, no write access.
  build:
    if: ${{ !(github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build parameters
        id: params
        run: echo "sde=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # arm64 under QEMU, from the pinned binfmt image (see BINFMT_IMAGE above), never cached.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:0.0.0-dev
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.params.outputs.sde }}
            VERSION=0.0.0-dev
          provenance: false
          sbom: false
          outputs: type=image,push=false,rewrite-timestamp=true,oci-mediatypes=true,compression=gzip
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Release tags (v*) only: build from nothing and push. The one job with `packages: write`.
  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.params.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build parameters
        id: params
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Also the image's only tag: nothing else may end up in it.
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha)?$ ]] || { echo "::error::Not a release version: ${GITHUB_REF_NAME}"; exit 1; }
          echo "sde=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # arm64 under QEMU, from the pinned binfmt image (see BINFMT_IMAGE above), never cached.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: ${{ env.BINFMT_IMAGE }}
          platforms: arm64
          cache-image: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      # GHCR_PUSH_TOKEN when the `release` environment has one, else GITHUB_TOKEN with a warning. Only with the former
      # can the package deny this repository's GITHUB_TOKEN write access, and so deny it to a workflow edited on a branch
      # (docs/android-signing.md, "The image"). Not an error without it: releases must keep working until the owner has
      # done those steps.
      - name: Which token pushes
        env:
          HAS_PUSH_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN != '' }}
        run: |
          if [ "${HAS_PUSH_TOKEN}" = "true" ]; then
            echo "Pushing with GHCR_PUSH_TOKEN, the release environment's token."
          else
            echo "::warning title=Image pushed with GITHUB_TOKEN::GHCR_PUSH_TOKEN is not set in the release environment, so this push uses GITHUB_TOKEN. Any workflow on any branch can ask for a GITHUB_TOKEN with packages: write and push over ${IMAGE}:<version>. Add GHCR_PUSH_TOKEN and give this repository's Actions only Read access to the package: docs/android-signing.md, \"The image\"."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_PUSH_TOKEN != '' && github.repository_owner || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      # A re-run (release.yml's redispatch) pushes the same tag again. The build is reproducible, so that is the same
      # digest; if the tag holds another one, the Digest step below fails the job and nothing downstream uses this push.
      - name: Is this version on GHCR already?
        id: previous
        env:
          VERSION: ${{ steps.params.outputs.version }}
        run: |
          set -euo pipefail
          if previous=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{.Manifest.Digest}}' 2>/dev/null) \
            && [[ "${previous}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::notice title=Version already on GHCR::${IMAGE}:${VERSION} is ${previous}: this build must push the same digest."
            echo "digest=${previous}" >> "$GITHUB_OUTPUT"
          else
            echo "${IMAGE}:${VERSION} is not on GHCR yet."
          fi

      # A release is built from nothing (no cache read or written), so a stale or poisoned cache cannot reach it.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          # The version, nothing else (see the header: no moving tags).
          tags: ${{ env.IMAGE }}:${{ steps.params.outputs.version }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.params.outputs.sde }}
            VERSION=${{ steps.params.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true,compression=gzip
          no-cache: true

      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PREVIOUS: ${{ steps.previous.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest ${DIGEST}"; exit 1; }
          if [ -n "${PREVIOUS}" ] && [ "${PREVIOUS}" != "${DIGEST}" ]; then
            echo "::error title=Version tag changed::${IMAGE}:${GITHUB_REF_NAME#v} was ${PREVIOUS} before this run and is now ${DIGEST}. A re-release must build the same image; nothing downstream uses this push. Find out why the builds differ (packaging/VERIFY.md) before releasing."
            exit 1
          fi
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Rebuild it from this commit and compare: see packaging/VERIFY.md."
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which the checks API returns (the summary is only on the web page).
          echo "::notice title=Published image::${IMAGE}@${DIGEST}"

  # Release tags: two more builds of the same commit, each from nothing on its own builder (reproducible.yml), at the
  # same time as `publish`. Their image index digest must be the one `publish` pushed (`verified`, below).
  reproducible:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      contents: read
    uses: ./.github/workflows/reproducible.yml

  # The gate between the push and everything that ships it: the compose file on the release, the Start9 package, the
  # Umbrel store and, through the digest artifact, publish-release.yml. They run only if the image on GHCR is the one
  # two independent clean builds of the tag's source produce, byte for byte; otherwise the release stops here, before
  # any of them names the image (and the GitHub release stays a draft).
  verified:
    needs: [publish, reproducible]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
    steps:
      - name: The pushed image is the reproduced one
        id: compare
        env:
          PUSHED: ${{ needs.publish.outputs.digest }}
          REBUILT: ${{ needs.reproducible.outputs.index-digest }}
        run: |
          set -euo pipefail
          [[ "${PUSHED}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::publish gave no digest: '${PUSHED}'"; exit 1; }
          [[ "${REBUILT}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::reproducible.yml gave no digest: '${REBUILT}'"; exit 1; }
          if [ "${PUSHED}" != "${REBUILT}" ]; then
            echo "::error title=Pushed image not reproduced::publish pushed ${IMAGE}@${PUSHED}, but two clean builds of ${GITHUB_SHA::12} give ${REBUILT}. Nothing ships it: no compose file, Umbrel store, Start9 package or published release. Compare them (packaging/VERIFY.md, \"If the digests differ\") before releasing."
            exit 1
          fi
          echo "digest=${PUSHED}" >> "$GITHUB_OUTPUT"
          echo "${PUSHED}" > "${RUNNER_TEMP}/guardian-image-digest.txt"
          echo "::notice title=Image reproduced::${IMAGE}@${PUSHED} is what two independent builds of ${GITHUB_SHA::12} give."

      # For publish-release.yml, which checks that the release's compose file pins this digest before it publishes.
      - name: Keep the digest for publish-release.yml
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-image-digest
          path: ${{ runner.temp }}/guardian-image-digest.txt
          if-no-files-found: error
          retention-days: 30

  # On a release tag: attach the plain-Docker files (packaging/compose) to the tag's draft release, the compose file
  # with the image pinned by the digest just pushed, so users download a file that runs exactly this image. release.yml
  # creates the draft before it dispatches this workflow on the tag (a tag made with GITHUB_TOKEN starts no `push: tags`
  # run, a dispatch does); for a tag pushed by hand, this job or android-apk.yml's release job makes the draft.
  compose-files:
    needs: [publish, verified]
    if: needs.verified.outputs.digest != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.publish.outputs.version }}
      DIGEST: ${{ needs.verified.outputs.digest }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin the image in the compose file
        run: |
          set -euo pipefail
          [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::unexpected digest ${DIGEST}"; exit 1; }
          out="${RUNNER_TEMP}/assets"
          mkdir -p "${out}"
          pinned="${IMAGE}:${VERSION}@${DIGEST}"
          {
            echo "# Trikey Guardian ${TAG}: the image is pinned by digest (${pinned})."
            echo "# Check it against your own build: packaging/VERIFY.md. Settings: trikey-guardian.env.example, saved as .env."
            # The release copy runs exactly this image: no TRIKEY_IMAGE override.
            sed -E "s|^(    image: )\\\$\{TRIKEY_IMAGE:-${IMAGE}:[^}]+\}\$|\1${pinned}|" packaging/compose/docker-compose.yml
          } > "${out}/trikey-guardian-compose.yml"
          grep -Fxq "    image: ${pinned}" "${out}/trikey-guardian-compose.yml" \
            || { echo "::error::could not pin the image in packaging/compose/docker-compose.yml (its image: line changed?)"; exit 1; }
          # Only settings count: the header comments may name the override.
          if grep -v '^[[:space:]]*#' "${out}/trikey-guardian-compose.yml" | grep -q 'TRIKEY_IMAGE'; then echo "::error::the release copy still names TRIKEY_IMAGE"; exit 1; fi
          cp packaging/compose/.env.example "${out}/trikey-guardian.env.example"
          (cd "${out}" && sha256sum trikey-guardian-compose.yml trikey-guardian.env.example > trikey-guardian-compose.sha256)
          cat "${out}/trikey-guardian-compose.sha256"

      - name: Check the pinned file
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/assets"
          cp "${out}/trikey-guardian.env.example" "${out}/.env"
          docker compose --project-directory "${out}" -f "${out}/trikey-guardian-compose.yml" config -q
          # The node profile needs RPC credentials, which the example leaves for the user to choose.
          BITCOIN_RPC_USER=check BITCOIN_RPC_PASS=check \
            docker compose --project-directory "${out}" -f "${out}/trikey-guardian-compose.yml" --profile node config --images | sort
          rm "${out}/.env"

      # To the draft only: publish-release.yml publishes the release once every asset is there and checked, and a
      # published release's files are never replaced. release.yml makes the draft before it dispatches this workflow;
      # for a tag pushed by hand, whichever of this job and android-apk.yml's comes first makes it.
      - name: Attach to the draft release
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/assets"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # `|| true`: android-apk.yml may make it at the same moment; the view below decides.
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft --prerelease --verify-tag \
              --title "Trikey ${TAG}" --notes "Trikey ${TAG}. The guardian image is ${IMAGE}:${VERSION}@${DIGEST}." || true
          fi
          draft="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [ "${draft}" != "true" ]; then
            echo "::warning title=Release already published::${TAG} is published, so its compose files are not replaced."
            exit 0
          fi
          gh release upload "${TAG}" --repo "${GITHUB_REPOSITORY}" --clobber \
            "${out}/trikey-guardian-compose.yml" "${out}/trikey-guardian.env.example" "${out}/trikey-guardian-compose.sha256"
          echo "::notice title=Compose files attached to the draft::${TAG}: trikey-guardian-compose.yml pins ${IMAGE}:${VERSION}@${DIGEST}"

  # The Start9 package (.s9pk files, workflow artifacts only), packed from the image `publish` pushed, by its digest,
  # once `verified` has confirmed it.
  start9:
    needs: verified
    if: needs.verified.outputs.digest != ''
    permissions:
      contents: read
    uses: ./.github/workflows/start9.yml
    with:
      image-digest: ${{ needs.verified.outputs.digest }}

  # The Umbrel store copy, with the image pinned by the digest `publish` pushed. Its job declares the `release`
  # environment, where the store token can live (docs/android-signing.md, "The `release` environment").
  umbrel-store:
    needs: verified
    if: needs.verified.outputs.digest != ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/umbrel-store.yml
    with:
      image-digest: ${{ needs.verified.outputs.digest }}
    secrets:
      UMBREL_STORE_TOKEN: ${{ secrets.UMBREL_STORE_TOKEN }}

  # Builds the image for this machine and starts it: the guardian must come up and answer /api/status.
  # Building alone does not show that every module the service imports is in the image (0.1.0-alpha and
  # 0.1.1-alpha shipped without the protocol's zod and could not start).
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (linux/amd64, loaded locally)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: trikey-guardian:smoke

      - name: Start it and wait for /api/status
        run: |
          docker run -d --name guardian -p 127.0.0.1:3000:3000 -e BITCOIN_NETWORK=regtest trikey-guardian:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/status > /tmp/status.json; then
              echo "The guardian answered after ${i} s:"; cat /tmp/status.json; echo
              docker logs guardian 2>&1 | tail -n 20
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' guardian)" != "true" ]; then break; fi
            sleep 1
          done
          echo "::error title=Image smoke test::the guardian did not answer /api/status"
          docker logs guardian 2>&1 | tail -n 60 | while IFS= read -r line; do echo "::error title=guardian log::${line}"; done
          exit 1
