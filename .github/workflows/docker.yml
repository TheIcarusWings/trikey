name: Docker

# Tags v* and manual runs build and push the guardian image (amd64 + arm64, since
# Umbrel runs on Raspberry Pi). Pull requests build only. Pushes use GITHUB_TOKEN;
# no other secrets are needed.
#
# The image is built to be reproducible: see packaging/VERIFY.md, and
# .github/workflows/reproducible.yml, which builds it twice and compares the digests.
# The two workflows must build the same way, so keep these in step with that file:
#   - the pinned BuildKit (driver-opts below),
#   - SOURCE_DATE_EPOCH and VERSION as build args,
#   - rewrite-timestamp=true on the exporter,
#   - no provenance or SBOM attestations (they record the build, and so differ per build),
#   - no `org.opencontainers.image.created` label (docker/metadata-action would add the
#     current time), which is why only `tags` is taken from the metadata step.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/theicaruswings/trikey-guardian
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build parameters
        id: params
        run: |
          echo "sde=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4.4.0

      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
          # BuildKit v0.34.1, by digest (moby/buildkit on Docker Hub, 2026-10-29).
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha

      - name: Build (and push, except on pull requests)
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.params.outputs.sde }}
            VERSION=${{ steps.params.outputs.version }}
          provenance: false
          sbom: false
          outputs: type=image,push=${{ github.event_name != 'pull_request' }},rewrite-timestamp=true,oci-mediatypes=true,compression=gzip
          # A release is built from nothing, so a stale or poisoned cache cannot reach it.
          no-cache: ${{ github.ref_type == 'tag' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
            echo
            echo "Rebuild it from this commit and compare: see packaging/VERIFY.md."
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as an annotation, which the checks API returns (the summary is only on the web page).
          echo "::notice title=Published image::${IMAGE}@${DIGEST}"

  # Builds the image for this machine and starts it: the guardian must come up and answer /api/status.
  # Building alone does not show that every module the service imports is in the image (0.1.0-alpha and
  # 0.1.1-alpha shipped without the protocol's zod and could not start).
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - name: Build (linux/amd64, loaded locally)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: trikey-guardian:smoke

      - name: Start it and wait for /api/status
        run: |
          docker run -d --name guardian -p 127.0.0.1:3000:3000 -e BITCOIN_NETWORK=regtest trikey-guardian:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/status > /tmp/status.json; then
              echo "The guardian answered after ${i} s:"; cat /tmp/status.json; echo
              docker logs guardian 2>&1 | tail -n 20
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' guardian)" != "true" ]; then break; fi
            sleep 1
          done
          echo "::error title=Image smoke test::the guardian did not answer /api/status"
          docker logs guardian 2>&1 | tail -n 60 | while IFS= read -r line; do echo "::error title=guardian log::${line}"; done
          exit 1
