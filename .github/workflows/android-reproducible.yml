name: Reproducible Android APK

# Checks that the Android APKs are reproducible. Builds each variant (standard, foss) twice from the same commit with
# the very steps of a release (android-build.yml, arm64-v8a) and fails unless:
#
# 1. the two APKs Gradle made (`<artifact>-unsigned`, before any re-signing) are identical, byte for byte; and
# 2. build A's APK as sign-apk.sh re-signed it (with a one-off key, as a release is with the release key) equals
#    build B's unsigned APK apart from the signing block. That is the check packaging/VERIFY.md asks of anyone who
#    rebuilds a release: `compare-apks.py --ignore-signature <published APK> <your build>`.
#
# Same inputs must give the same bytes: that is what lets anyone rebuild a release and check it against the APK on the
# releases page, as packaging/VERIFY.md does for the guardian's image. When they differ, the job says what differs
# (packaging/android/compare-apks.py), decodes resources.arsc with aapt2 and runs diffoscope, and keeps both APKs.
#
# The release key stays out of this workflow: Expo's generated project signs the APK with its public debug key (RSA,
# so the signature itself is deterministic), and the re-signing here uses the one-off key.
#
# How the two builds differ on purpose:
# - B runs after A, not beside it, so anything taken from the clock shows up;
# - B uses no Gradle cache (A uses the usual one), so nothing restored from an earlier run can hide a difference;
# - they run on two runners, so anything taken from the machine shows up (the runner's IP address did, until
#   android-build.yml set reactNativeDevServerIp).
# What they share, so this does not catch it yet: the runner image (the same JDK, SDK command-line tools, the build
# tools and NDK Gradle downloads, both fetched fresh) and the checkout path. A build in a pinned container, at another
# path, is a later step.
#
# It runs by hand (Actions, "Reproducible Android APK", Run workflow) and on pull requests that change the Android
# build's workflow or these scripts. Each run is four full builds, so it does not run on every pull request that
# touches the app.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-reproducible.yml'
      - '.github/workflows/android-build.yml'
      - 'packaging/android/compare-apks.py'
      - 'packaging/android/sign-apk.sh'

permissions:
  contents: read

concurrency:
  group: android-reproducible-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-a:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, foss]
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: arm64-v8a
      artifact-name: repro-a-${{ matrix.variant }}
      signing: one-off
      variant: ${{ matrix.variant }}
      keep-unsigned: true
      gradle-cache: true

  build-b:
    needs: build-a
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, foss]
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: arm64-v8a
      artifact-name: repro-b-${{ matrix.variant }}
      signing: one-off
      variant: ${{ matrix.variant }}
      keep-unsigned: true
      gradle-cache: false

  compare:
    needs: [build-a, build-b]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, foss]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packaging/android
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-a-${{ matrix.variant }}-unsigned
          path: ${{ runner.temp }}/a

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-b-${{ matrix.variant }}-unsigned
          path: ${{ runner.temp }}/b

      # Build A's APK after sign-apk.sh re-signed it, as a release's is.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repro-a-${{ matrix.variant }}
          path: ${{ runner.temp }}/a-signed

      - name: Compare the two APKs
        id: compare
        run: |
          set -uo pipefail
          # Actions runs this with `bash -e`: catch the status, or "they differ" (1) ends the step before the report.
          status=0
          python3 -I packaging/android/compare-apks.py \
            "${RUNNER_TEMP}/a/app-release.apk" "${RUNNER_TEMP}/b/app-release.apk" > "${RUNNER_TEMP}/report.md" || status=$?
          cat "${RUNNER_TEMP}/report.md"
          {
            echo "## ${VARIANT} APK, build A against build B"
            echo
            echo "Commit \`${GITHUB_SHA}\`. A: Gradle cache on. B: built after A, no Gradle cache."
            echo
            cat "${RUNNER_TEMP}/report.md"
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${status}" in
            0) echo "::notice title=Reproducible (${VARIANT})::The two builds of the ${VARIANT} APK are identical." ;;
            1) echo "::error title=Not reproducible (${VARIANT})::The two builds of the ${VARIANT} APK differ. The job summary lists what differs; the repro-diff-${VARIANT} artifact has both APKs and diffoscope's report." ;;
            *) echo "::error title=Comparison failed (${VARIANT})::Could not read the APKs (exit ${status})." ;;
          esac
          exit "${status}"

      # What a verifier does with a release (packaging/VERIFY.md): the published APK has the release key's signature,
      # their rebuild Expo's debug one, so everything but the signing block must be the same. Here build A re-signed
      # with the one-off key stands for the published APK, build B's unsigned APK for the rebuild.
      - name: Compare build A as re-signed with build B, signing blocks aside
        if: success() || failure()
        run: |
          set -uo pipefail
          shopt -s nullglob
          signed=("${RUNNER_TEMP}"/a-signed/*.apk)
          [ "${#signed[@]}" = 1 ] || { echo "::error::Expected one signed APK in repro-a-${VARIANT}, found ${#signed[@]}"; exit 2; }
          status=0
          python3 -I packaging/android/compare-apks.py --ignore-signature \
            "${signed[0]}" "${RUNNER_TEMP}/b/app-release.apk" > "${RUNNER_TEMP}/report-signed.md" || status=$?
          cat "${RUNNER_TEMP}/report-signed.md"
          {
            echo "## ${VARIANT} APK, build A re-signed against build B unsigned, signing blocks aside"
            echo
            echo "A: \`$(basename "${signed[0]}")\` (one-off key, as sign-apk.sh signs a release). B: as Gradle made it."
            echo
            cat "${RUNNER_TEMP}/report-signed.md"
          } >> "${GITHUB_STEP_SUMMARY}"
          case "${status}" in
            0) echo "::notice title=Re-signed APK matches (${VARIANT})::Build A, re-signed, equals build B apart from the signing block." ;;
            1) echo "::error title=Re-signed APK differs (${VARIANT})::Build A, re-signed, differs from build B in more than the signing block, so a rebuild could not be checked against a release this way." ;;
            *) echo "::error title=Comparison failed (${VARIANT})::Could not read the APKs (exit ${status})." ;;
          esac
          exit "${status}"

      # Only when they differ: decode resources.arsc with aapt2 (from the build tools already on the runner image,
      # ANDROID_HOME, as the release `sign` job uses them; nothing downloaded) and diff the decoded tables. `dump strings`
      # lists the global string pool in stored order, `dump resources` every resource with its id and values. Same
      # strings in another order shows up as an empty sorted diff and a non-empty ordered one.
      - name: Decode resources.arsc with aapt2
        if: failure() && steps.compare.outcome == 'failure'
        continue-on-error: true
        run: |
          # Not -e: diff says "they differ" with status 1, which is the point here.
          set +e -uo pipefail
          bt="$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -n 1)"
          aapt2="${bt%/}/aapt2"
          "${aapt2}" version
          out="${RUNNER_TEMP}/arsc"
          mkdir -p "${out}"
          for x in a b; do
            "${aapt2}" dump strings "${RUNNER_TEMP}/${x}/app-release.apk" > "${out}/strings-${x}.txt"
            "${aapt2}" dump resources "${RUNNER_TEMP}/${x}/app-release.apk" > "${out}/resources-${x}.txt"
            # The strings alone, without the "String #n : " index, so a moved string is one - and one + line.
            sed -n 's/^String #[0-9]* : //p' "${out}/strings-${x}.txt" > "${out}/pool-${x}.txt"
          done
          diff -u "${out}/pool-a.txt" "${out}/pool-b.txt" > "${out}/pool.diff"
          diff <(sort "${out}/pool-a.txt") <(sort "${out}/pool-b.txt") > "${out}/pool-sorted.diff"
          diff -u "${out}/resources-a.txt" "${out}/resources-b.txt" > "${out}/resources.diff"
          # The first string index where the two pools part, and the run of strings that differ in place.
          python3 -I - "${out}/pool-a.txt" "${out}/pool-b.txt" > "${out}/moved.txt" <<'PY'
          import sys
          a = open(sys.argv[1], encoding="utf-8", errors="replace").read().split("\n")
          b = open(sys.argv[2], encoding="utf-8", errors="replace").read().split("\n")
          diff = [i for i in range(min(len(a), len(b))) if a[i] != b[i]]
          print(f"pool sizes: {len(a)} / {len(b)}; positions that differ: {len(diff)}")
          if diff:
              print(f"first {diff[0]}, last {diff[-1]}")
              for i in diff[:400]:
                  print(f"#{i}: A {a[i]!r} | B {b[i]!r}")
          PY
          {
            echo "### resources.arsc decoded (${VARIANT}, aapt2 $("${aapt2}" version 2>&1 | head -n 1))"
            echo
            head -n 3 "${out}/strings-a.txt"
            echo
            echo "Same strings, sorted: $([ -s "${out}/pool-sorted.diff" ] && echo no || echo yes)." \
              "Same resources (dump resources): $([ -s "${out}/resources.diff" ] && echo no || echo yes)."
            echo
            echo '```'
            head -n 120 "${out}/moved.txt"
            echo '```'
            echo '```diff'
            head -n 80 "${out}/pool-sorted.diff"
            echo '```'
            echo '```diff'
            head -n 120 "${out}/resources.diff"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          head -n 3 "${out}/strings-a.txt" "${out}/strings-b.txt"
          cat "${out}/moved.txt"
          echo "--- sorted pool diff"
          head -n 200 "${out}/pool-sorted.diff"
          echo "--- dump resources diff"
          head -n 400 "${out}/resources.diff"

      # Only when they differ: diffoscope shows the bytes (dex, native libraries, the JS bundle). Best effort: the
      # comparison above is the verdict, this is for reading. No recommended packages, so no decompilers: it still
      # unpacks the APKs and diffs every entry.
      - name: diffoscope
        if: failure() && steps.compare.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends diffoscope
          diffoscope --version
          rc=0
          diffoscope --max-report-size 50000000 --html "${RUNNER_TEMP}/diffoscope.html" --text "${RUNNER_TEMP}/diffoscope.txt" \
            "${RUNNER_TEMP}/a/app-release.apk" "${RUNNER_TEMP}/b/app-release.apk" || rc=$?
          head -c 60000 "${RUNNER_TEMP}/diffoscope.txt" || true
          {
            echo "### diffoscope (${VARIANT}, the first 20,000 characters)"
            echo '```'
            head -c 20000 "${RUNNER_TEMP}/diffoscope.txt" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          # 1 means "differences found", which is why this step runs.
          [ "${rc}" -le 1 ]

      - name: Keep the APKs and the reports when they differ
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repro-diff-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/a/app-release.apk
            ${{ runner.temp }}/b/app-release.apk
            ${{ runner.temp }}/a-signed/*.apk
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/report-signed.md
            ${{ runner.temp }}/diffoscope.html
            ${{ runner.temp }}/diffoscope.txt
            ${{ runner.temp }}/arsc/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
