name: Android launch check

# Builds the Android test APK for x86_64 (the same release build, Hermes bundle and one-off signing as the
# testers' arm64-v8a APK: android-build.yml), installs it in an Android emulator, opens it, and fails if the
# app is not running 25 seconds later or its log shows a crash. Catches an APK that installs but closes
# straight away, which no unit test or bundler run sees.
#
# What it reports (CI log downloads are blocked for us; annotations can be read through the checks API):
# - failed: `::error` annotations with the lines that say why, most telling first: the FATAL EXCEPTION
#   block, the JavaScript error and its stack, the native abort message and backtrace, the exit reason;
# - passed: one `::notice` with the first JavaScript log lines.
# The full logcat, the app's own lines, a screenshot and any tombstones are in the `android-launch-logcat`
# artifact. The scripts are .github/scripts/android-launch.sh (drives the emulator) and
# .github/scripts/android-launch-report.py (judges and reports); both run locally against any emulator.
#
# Then, in the same emulator and only if the app was running, a short walk through the demo with Maestro
# (apps/mobile/.maestro/demo-walk.yaml): Welcome into Demo mode, Home and its balance, Send to the amount, Receive,
# Settings and Activity, back to Home each time. It fails the job when a step fails (a screen that crashes or shows
# nothing when it is opened) or the app crashes during it. .github/scripts/android-walk.sh runs it and collects the
# walk's logcat; .github/scripts/demo-walk-report.py posts the failing step, Maestro's error, the steps before it and
# the app's log lines of the walk as `::error` annotations (one `::notice` when it passes). Maestro's screenshots,
# JUnit report and debug output, and the walk's logcat, are in the `android-demo-walk` artifact. Maestro is installed
# from its GitHub release by .github/scripts/install-maestro.sh, pinned by version and SHA-256. The emulator is a
# Pixel 6 profile, tall enough for the Welcome screen's wallet mode picker.

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/android-launch.yml'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/android-build.yml'
      - '.github/scripts/android-launch*'
      - '.github/scripts/android-walk.sh'
      - '.github/scripts/demo-walk-report.py'
      - '.github/scripts/install-maestro.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/android-build.yml
    with:
      architectures: x86_64
      artifact-name: trikey-android-apk-x86_64

  launch:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_ID: ${{ needs.build.outputs.application-id }}
      APK: apk/${{ needs.build.outputs.apk-name }}.apk
      OUT: launch-out
      WAIT_SECONDS: '25'
      WALK_OUT: walk-out
      WALK_TIMEOUT: '480'
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          sparse-checkout: |
            .github
            apps/mobile/.maestro

      - uses: actions/download-artifact@v4.3.0
        with:
          name: trikey-android-apk-x86_64
          path: apk

      # Maestro (the demo walk) runs on Java 17 or newer.
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4.3.0
        with:
          path: ~/.maestro-cli
          key: maestro-${{ runner.os }}-${{ hashFiles('.github/scripts/install-maestro.sh') }}

      # A failed install does not stop the launch check: the walk then reports that it could not run.
      - name: Install Maestro
        continue-on-error: true
        run: bash .github/scripts/install-maestro.sh

      # The emulator needs hardware acceleration: let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the APK in an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          disable-animations: true
          # The launch check first, as it was; then the demo walk (it skips itself if the app was not running).
          script: |
            bash .github/scripts/android-launch.sh
            bash .github/scripts/android-walk.sh

      - name: Report
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/android-launch-report.py "${OUT}"

      - uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: android-launch-logcat
          path: launch-out/
          if-no-files-found: warn
          retention-days: 14

      - name: Report the demo walk
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/demo-walk-report.py "${WALK_OUT}" "${OUT}"

      - uses: actions/upload-artifact@v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: android-demo-walk
          path: walk-out/
          if-no-files-found: ignore
          retention-days: 14
