releaseNotes: >-
  On Umbrel, Electrs 0.11.1 can't read Bitcoin Core 32's mempool, so it sees no unconfirmed payments and answers
  every request about 7 s late. The guardian now reads unconfirmed payments from Bitcoin Core itself, warns on its
  page with both fixes (deprecatedrpc=bip125, or Settings, Server, Bitcoin Core alone), and treats its own
  broadcasts as pending. New Wallet page: balance, payments, the daily limit and the address to receive at.
