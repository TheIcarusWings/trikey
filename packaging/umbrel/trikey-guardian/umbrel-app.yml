gallery: []
releaseNotes: >-
  Payments show up on your phone the moment they reach the mempool, from any device, and again when they
  confirm, and syncs take milliseconds instead of seconds. Optional: payment notices on your own email, ntfy or
  webhook (Settings, Notifications, Payments). A payment waiting to confirm can be sped up. New: host a guardian
  for family members you invite ("Host for someone"); you never see their addresses or balances.
dependencies:
