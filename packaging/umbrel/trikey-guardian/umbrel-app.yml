releaseNotes: >-
  Unlock the guardian with your hardware wallet after a restart (opt-in, from the 0.1.17 app); the passphrase keeps
  working. Unlocks from the phone are now sealed to a key the guardian keeps only in memory, so old relay messages
  can't reveal them. QR hardware wallets (Coldcard Q, Jade, Keystone 3, Passport Prime, Specter DIY) can now set up
  a guardian wallet.
