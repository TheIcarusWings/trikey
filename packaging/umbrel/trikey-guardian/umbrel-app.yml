gallery: []
releaseNotes: >-
  The guardian and the app keep listening after a relay restarts or a connection drops: before, the
  phone could stop hearing the guardian ("Guardian offline", no balance) until the app was restarted.
  A slow answer no longer shows as offline. Savings payments waiting to confirm can be sped up, and
  Trikey's own relay is offered at setup (Settings, Change relays, to add it to an existing guardian).
dependencies:
