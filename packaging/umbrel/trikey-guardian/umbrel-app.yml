gallery: []
releaseNotes: >-
  A fix release. The guardian now sends out a payment without first reading the whole wallet from Electrs
  again when it has just co-signed it, or when it spends a coin the last sync listed (that coin is checked
  instead), so a payment shows in the app in seconds instead of about a minute. With the 0.1.11 app: no more "Guardian offline" after the phone
  slept, and mainnet fees never below 1 sat/vB.
