manifestVersion: 1
id: trikey-guardian
name: Trikey Guardian
tagline: Key 3 of your 2-of-3 bitcoin wallet, on your own node
# TODO(verify): the icon is a placeholder (the web UI favicon). Replace with a proper icon URL.
