description: >-
  Trikey is a 2-of-3 bitcoin wallet in which every key belongs to you: a hardware wallet,
  your phone, and a guardian on your own Umbrel.


  Trikey Guardian is the third key. It co-signs phone payments under a daily limit you set,
  and it runs a Delay & Notify recovery if you lose your phone. It talks to your own Bitcoin
  node and Electrs, opens no inbound ports, and holds its key only in memory while unlocked.

