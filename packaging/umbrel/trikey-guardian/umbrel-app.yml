---
manifestVersion: 1
id: trikey-guardian
name: Trikey Guardian
tagline: Key 3 of your 2-of-3 bitcoin wallet, on your own node
# TODO(verify): the icon is a placeholder (the web UI favicon). Replace with a proper icon URL.
icon: https://raw.githubusercontent.com/TheIcarusWings/trikey/main/apps/guardian-web/public/favicon.svg
category: bitcoin
version: "0.1.23-alpha"
# TODO(verify): host-facing port for the app_proxy. Pick one that no other app in the store uses.
port: 3010
description: >-
  Trikey is a 2-of-3 bitcoin wallet in which every key belongs to you: a hardware wallet,
  your phone, and a guardian on your own Umbrel.


  Trikey Guardian is the third key. It co-signs phone payments under a daily limit you set,
  and it runs a Delay & Notify recovery if you lose your phone. It talks to your own Bitcoin
  node and Electrs, opens no inbound ports, and holds its key only in memory while unlocked.

developer: Trikey contributors
website: https://github.com/TheIcarusWings/trikey
submitter: Trikey contributors
repo: https://github.com/TheIcarusWings/trikey
support: https://github.com/TheIcarusWings/trikey/issues
# TODO(verify): the store's gallery format. Add screenshots once the UI is stable.
gallery: []
releaseNotes: >-
  Security release, from a second review. Umbrel backups now leave the guardian out (after restoring a backup, set it
  up again and use Replace guardian). Another app on your Umbrel can no longer use the guardian page's sign-in. Your
  hardware wallet now shows your alert contacts by name, adding a wallet needs your first wallet's hardware wallet, a
  stolen phone can no longer freeze a recovery with unsent payments, and turning hardware unlock off and on replaces
  it. Update the app too.
dependencies:
  - bitcoin
  - electrs
# The guardian's whole data folder stays out of umbrelOS backups, on purpose, as on Start9 (DESIGN.md, "Holds no
# backup of key 3"): it holds key 3's keystore, the nostr key, the alert channels' key file, the hardware unlock slots
# and the rules' state, and a restored copy would bring back old daily-limit accounting and a key 3 that was reset.
# An Umbrel restored from a backup starts a new, empty guardian; the owner moves the wallet to it with Replace
# guardian (phone + hardware wallet). umbreld reads these paths relative to the app's folder, where `data` is the
# folder docker-compose.yml mounts at /data; `data/*` keeps the (empty) folder itself in the backup, so a restore
# brings it back owned by the image's user, not made by Docker as root. Read from umbreld's source (getumbrel/umbrel,
# modules/apps/app.ts getBackupIgnoredFilePaths, modules/backups/backups.ts); TODO(verify): a backup and restore on a
# real Umbrel (the guardian starts empty and can write /data).
backupIgnore:
  - data/*
path: ""
defaultUsername: ""
defaultPassword: ""
