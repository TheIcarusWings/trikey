# Trikey Guardian on plain Docker: a Mac or Windows PC with Docker Desktop, Linux, or a NAS (Synology Container
# Manager, QNAP Container Station, Unraid, TrueNAS). Read README.md next to this file first.
#
#   cp .env.example .env      then fill in .env: your network and your Electrum server
#   docker compose up -d
#   docker compose logs guardian | grep setup.code      the one-time setup code for the first run
#   open http://localhost:3000
#
# The guardian needs a Bitcoin node with an Electrum server (Electrs or Fulcrum) that it can reach: your own, on
# another box or on this one. `--profile node` also runs one here (bitcoind + Electrs; see README.md, "A node in
# this file").
#
# The guardian makes outbound connections only (the nostr relays, your Electrum server and node). Nothing has to be
# forwarded on your router. The one port below is the web UI, for you.
#
# Download this file from a release (trikey-guardian-compose.yml): that copy pins the image by its digest, so what
# runs is exactly the image that release built (packaging/VERIFY.md).
name: trikey-guardian

services:
  guardian:
    image: ${TRIKEY_IMAGE:-ghcr.io/theicaruswings/trikey-guardian:0.1.8-alpha}
    restart: unless-stopped
    init: true
    ports:
      # The web UI. 127.0.0.1: only this computer can open it (right for a Mac or a PC). On a NAS you open it from
      # another computer: set TRIKEY_UI_BIND=0.0.0.0 in .env, and read README.md, "Opening the web UI from another
      # computer" (the passphrase then crosses your network over plain HTTP).
      - "${TRIKEY_UI_BIND:-127.0.0.1}:${TRIKEY_UI_PORT:-3000}:3000"
    volumes:
      # A named volume, not a folder: Docker creates it owned by the image's user (uid 1000), so the guardian can
      # write to it on every system. It holds key 3 (encrypted with your passphrase). There is no other copy: see
      # README.md, "Backups".
      - guardian-data:/data
    environment:
      PORT: "3000"
      TRIKEY_DATA_DIR: /data
      # No platform login stands in front of the web UI here, so the first-run setup asks for the setup code the
      # guardian prints in its log. Never change this to umbrel or start9.
      TRIKEY_PLATFORM: docker
      BITCOIN_NETWORK: ${BITCOIN_NETWORK:?set BITCOIN_NETWORK in .env (mainnet, testnet4, signet or regtest)}
      ELECTRUM_HOST: ${ELECTRUM_HOST:?set ELECTRUM_HOST in .env (your Electrum server)}
      ELECTRUM_PORT: ${ELECTRUM_PORT:-}
      ELECTRUM_TLS: ${ELECTRUM_TLS:-0}
      ELECTRUM_TLS_CERT_SHA256: ${ELECTRUM_TLS_CERT_SHA256:-}
      ELECTRUM_ALLOW_PUBLIC_PLAINTEXT: ${ELECTRUM_ALLOW_PUBLIC_PLAINTEXT:-0}
      BITCOIN_RPC_HOST: ${BITCOIN_RPC_HOST:-}
      BITCOIN_RPC_PORT: ${BITCOIN_RPC_PORT:-}
      BITCOIN_RPC_USER: ${BITCOIN_RPC_USER:-}
      BITCOIN_RPC_PASS: ${BITCOIN_RPC_PASS:-}
      TRIKEY_RELAYS: ${TRIKEY_RELAYS:-}
      SP_SCAN_THREADS: ${SP_SCAN_THREADS:-}
    extra_hosts:
      # A node on this same computer: ELECTRUM_HOST=host.docker.internal works on Linux too (Docker Desktop has it).
      - "host.docker.internal:host-gateway"
    healthcheck:
      # The image's own check: the web UI answers. node is in the image; curl is not.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---- optional: a node in this file (`docker compose --profile node up -d`) ----------------------------------------
  # Bitcoin Core and Electrs, for a computer that has no node yet. Signet and testnet4 need some tens of GB and sync in
  # hours. Mainnet needs about 850 GB (the chain and Electrs' index) and several days of sync: a NAS with a large disk,
  # not a laptop. Set ELECTRUM_HOST=electrs and BITCOIN_RPC_HOST=bitcoind in .env (see .env.example).
  #
  # Images pinned by tag and digest (the digest is the multi-arch index: amd64 and arm64):
  #   bitcoin/bitcoin 32.1        Bitcoin Core's own image
  #   getumbrel/electrs v0.12.0   romanz/electrs as Umbrel builds and ships it (the Electrs a guardian talks to on an
  #                               Umbrel; Electrs publishes no image of its own)
  # The same pins as e2e/docker-compose.yml, whose tests run against them.
  bitcoind:
    profiles: [node]
    image: bitcoin/bitcoin:32.1@sha256:d2454aaf2ff4ce1ebbc49f4aa05ed044c907b849a80a3f4c0ad23e488e50bbe0
    restart: unless-stopped
    environment:
      # Not `:?`: Compose would then refuse to start even the guardian alone while these are empty.
      NODE_NETWORK: ${BITCOIN_NETWORK:-}
      NODE_RPC_USER: ${BITCOIN_RPC_USER:-}
      NODE_RPC_PASS: ${BITCOIN_RPC_PASS:-}
    # The image's entrypoint runs bitcoind as its own user (and owns the data volume for it). The credentials come from
    # the environment, never from this file. RPC listens on the containers' network only: no port is published.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${NODE_RPC_USER}" ] || [ -z "$${NODE_RPC_PASS}" ]; then
          echo "Set BITCOIN_RPC_USER and BITCOIN_RPC_PASS in .env for the node profile"; exit 1
        fi
        case "$${NODE_NETWORK}" in
          mainnet|bitcoin|main) chain=main ;;
          testnet4) chain=testnet4 ;;
          signet) chain=signet ;;
          regtest) chain=regtest ;;
          *) echo "The node profile runs mainnet, testnet4, signet or regtest, not $${NODE_NETWORK}"; exit 1 ;;
        esac
        exec /entrypoint.sh bitcoind -chain="$${chain}" -server=1 -rest=1 -prune=0 -listenonion=0 -printtoconsole=1 \
          -rpcport=8332 -rpcbind=0.0.0.0 -rpcallowip=10.0.0.0/8 -rpcallowip=172.16.0.0/12 -rpcallowip=192.168.0.0/16 \
          -rpcuser="$${NODE_RPC_USER}" -rpcpassword="$${NODE_RPC_PASS}"
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", 'bitcoin-cli -rpcconnect=127.0.0.1 -rpcport=8332 -rpcuser="$$NODE_RPC_USER" -rpcpassword="$$NODE_RPC_PASS" getblockchaininfo > /dev/null']
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # Electrs waits until Bitcoin Core has finished its initial sync, then indexes (hours on mainnet).
  electrs:
    profiles: [node]
    image: getumbrel/electrs:v0.12.0@sha256:83cb57d7b23f553b3bb858f47e784018a723993777508f2299dc07c2fccb9db0
    restart: unless-stopped
    depends_on:
      bitcoind:
        condition: service_started
    environment:
      # Not `:?`: Compose would then refuse to start even the guardian alone while these are empty.
      NODE_NETWORK: ${BITCOIN_NETWORK:-}
      NODE_RPC_USER: ${BITCOIN_RPC_USER:-}
      NODE_RPC_PASS: ${BITCOIN_RPC_PASS:-}
    # Electrs takes the RPC credentials from a config file only. It is written at every start into the container's
    # /tmp (gone with the container), never into the volume. The index lives in /data, the image user's home.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$${NODE_RPC_USER}" ] || [ -z "$${NODE_RPC_PASS}" ]; then
          echo "Set BITCOIN_RPC_USER and BITCOIN_RPC_PASS in .env for the node profile"; exit 1
        fi
        case "$${NODE_NETWORK}" in
          mainnet|bitcoin|main) net=bitcoin ;;
          testnet4|signet|regtest) net="$${NODE_NETWORK}" ;;
          *) echo "The node profile runs mainnet, testnet4, signet or regtest, not $${NODE_NETWORK}"; exit 1 ;;
        esac
        umask 077
        cat > /tmp/electrs.toml <<EOF
        network = "$${net}"
        auth = "$${NODE_RPC_USER}:$${NODE_RPC_PASS}"
        daemon_rpc_addr = "bitcoind:8332"
        electrum_rpc_addr = "0.0.0.0:50001"
        db_dir = "/data/db"
        log_filters = "INFO"
        EOF
        exec electrs --conf /tmp/electrs.toml
    volumes:
      - electrs-data:/data
    stop_grace_period: 1m

volumes:
  guardian-data:
  bitcoin-data:
  electrs-data:
