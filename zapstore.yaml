# Zapstore listing (https://zapstore.dev), read by zsp. Zapstore picks up each GitHub release by itself once the
# maintainer has linked the APK signing certificate to Trikey's publisher npub (run `zsp` once; see
# docs/zapstore.md). No key or secret belongs in this file or in this repository.
# This is the standard app's listing (Trikey, app.trikey.wallet). The app without Google code (Trikey FOSS,
# app.trikey.wallet.foss) is a separate app with its own listing: packaging/zapstore/foss/zapstore.yaml.
repository: https://github.com/TheIcarusWings/trikey
release_source: https://github.com/TheIcarusWings/trikey
pubkey: npub1qussfnkjk6fvr36syatltxl0ks5pssyx7hrhf8zpnp9mf04e5j2sswedj9
# The standard APK only (trikey-alpha-v<version>.apk), never its .sha256.
match: '^trikey-alpha-v[0-9][^/]*\.apk$'
# Releases up to 0.1.25-alpha are GitHub pre-releases (later ones are normal releases); publish those on the main
# channel too.
prerelease_channel: main

name: Trikey
summary: A 2-of-3 bitcoin wallet where every key is yours. Pre-alpha, open source, not audited.
description: |
  Trikey is a 2-of-3 bitcoin wallet: your hardware wallet (Ledger, Trezor, Coldcard, BitBox, Jade and more), this
  phone, and the Trikey Guardian on your own Umbrel, Start9 or computer. Everyday payments need only the phone, under a daily limit the guardian enforces. Bigger
  payments and rule changes need your hardware wallet. Lose the phone and a Delay & Notify recovery gets your money
  back while your alert contacts are told over nostr.

  Made by Icarus Wings, nostr:npub19tzp8lf3klmqj3dz9mz0qnuvjp7uyy9993gmljmyaxs8phztj7wsnujvq5 (icaruswings@trikey.app).
  Published by Trikey's own npub (trikey@trikey.app), and signed with the same key as the GitHub releases.

  **Pre-alpha, open source, not audited.** Use test networks, or on mainnet only an amount you can afford to lose.
license: MIT
website: https://trikey.app
tags: [bitcoin, wallet, multisig, nostr]
icon: ./apps/mobile/assets/icon.png
release_notes: ./CHANGELOG.md
metadata_sources: [github]
