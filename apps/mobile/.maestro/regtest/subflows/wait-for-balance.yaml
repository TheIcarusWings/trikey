# On Home: pulls down to refresh until the balance reads BALANCE (a regular expression for the balance's label, such
# as 'Balance: 1,000,000 sats.*'), for up to about three minutes. The app also syncs by itself every minute.
appId: app.trikey.wallet.test
---
- extendedWaitUntil:
    visible:
      id: home-balance
    timeout: 60000
    label: Home is there
- repeat:
    times: 18
    while:
      notVisible: ${BALANCE}
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 75%
          duration: 400
          label: Pull down to refresh
      - extendedWaitUntil:
          visible: ${BALANCE}
          timeout: 10000
          optional: true
          label: Wait for the balance
- assertVisible:
    text: ${BALANCE}
    label: Home shows the balance
