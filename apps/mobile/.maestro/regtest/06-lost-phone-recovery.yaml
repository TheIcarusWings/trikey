# The lost-phone recovery path, the part that fits in a test run (docs/alpha-test-plan.md step 12a): the phone is gone
# with its backup, so on a "new phone" (this one, its wallet removed) the guardian's "Recover on a new phone" code and
# the hardware wallet start a recovery. The phone shows the waiting period, and the guardian says, through its own API,
# that a recovery is in progress. Then it is cancelled from the phone (the guardian must agree), and the phone is
# restored from its backup after all and pays again. The 7-day wait itself is not run: the real guardian counts it on its
# own clock and on the chain's median time (e2e/test/recovery.test.ts covers the end of it).
appId: app.trikey.wallet.test
name: Lost phone, start a recovery with the guardian's code and the device, cancel it, restore
tags:
  - regtest
---
- runFlow:
    file: subflows/open-app.yaml
- extendedWaitUntil:
    visible:
      id: home-balance
    timeout: 60000
    label: Home is there
- runScript:
    file: scripts/rig.js
    env:
      CALL: /recovery-code
      GUARDIAN: '1'
    label: The guardian's "Recover on a new phone" code
- evalScript: ${output.recoverCode = output.rig.uri}
- runFlow:
    file: subflows/remove-wallet.yaml

# A new phone: "My phone and its backup" are what was lost.
- tapOn:
    text: I already have a Trikey wallet
    label: Tap "I already have a Trikey wallet"
- extendedWaitUntil:
    visible: 'My phone and its backup.*'
    timeout: 20000
    label: Wait for "What did you lose?"
- tapOn:
    text: 'My phone and its backup.*'
    label: Pick "My phone and its backup"
- extendedWaitUntil:
    visible: '.*-day security waiting period'
    timeout: 20000
    label: It explains the waiting period
- tapOn:
    text: Start with simulated device
    label: Tap "Start with simulated device"
- extendedWaitUntil:
    visible:
      id: recover-guardian-code
    timeout: 20000
    label: Wait for "Find your guardian"
- tapOn:
    id: recover-guardian-code
    label: Tap the recovery code field
- inputText:
    text: ${output.recoverCode}
    label: Type the guardian's recovery code
- tapOn:
    text: 'Next: connect your hardware wallet'
    label: Tap "Next, connect your hardware wallet"
- extendedWaitUntil:
    visible: 'Simulated device.*'
    timeout: 30000
    label: Wait for the list of devices
- tapOn:
    text: 'Simulated device.*'
    label: Pick the simulated device
- extendedWaitUntil:
    visible: Recovery in progress
    timeout: 180000
    label: Wait for "Recovery in progress"
- assertVisible:
    text: Recovery started with your simulated device
    label: The recovery was started with the device
- assertVisible:
    text: Alerts sent
    label: Alerts went out
- runScript:
    file: scripts/rig.js
    env:
      CALL: /guardian
      GUARDIAN: '1'
    label: Ask the guardian
# The guardian has a recovery in progress.
- assertTrue: ${output.rig.recoveryInProgress == true}

# Cancel it from the phone.
- tapOn:
    text: Cancel recovery
    label: Tap "Cancel recovery"
- extendedWaitUntil:
    visible: 'My phone, but I have its backup.*|Start again'
    timeout: 120000
    label: Cancelled, back on "What did you lose?"
- runFlow:
    when:
      visible: Start again
    commands:
      - tapOn: Start again
- runScript:
    file: scripts/rig.js
    env:
      CALL: /guardian
      GUARDIAN: '1'
    label: Ask the guardian again
# The guardian has no recovery any more.
- assertTrue: ${output.rig.recoveryInProgress == false}

# The backup after all: the wallet comes back and pays with the guardian.
- runFlow:
    file: subflows/restore.yaml
- runFlow:
    label: Resume phone payments if the cancel paused them
    when:
      visible: 'Resume with simulated device'
    commands:
      - tapOn: 'Resume with simulated device'
      - extendedWaitUntil:
          notVisible: 'Resume with simulated device'
          timeout: 120000
- runFlow:
    file: subflows/pay-5000.yaml
