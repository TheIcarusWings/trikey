# Not Trikey: Android's own Settings, to enrol a fingerprint on a fresh emulator. Trikey keeps the phone's key behind
# the fingerprint (expo-secure-store with requireAuthentication), so a phone without one cannot make a wallet.
# .github/scripts/android-ui-e2e.sh sets the screen lock PIN (1234) and opens the enrolment screen first, and keeps a
# finger touching the emulator's sensor in the background (`adb emu finger touch 1`), which also answers every
# fingerprint prompt of the flows after this one. Here, in whatever order the screens come: close another app's "isn't
# responding" dialog (a loaded CI emulator's launcher shows one), confirm the PIN, accept the introduction ("More"
# scrolls it, then "I agree"), and wait for the touches until Android says the fingerprint is added.
appId: com.android.settings
name: Enrol a fingerprint on the emulator (Android Settings)
tags:
  - regtest
---
- repeat:
    times: 60
    while:
      notVisible: '(?i).*fingerprint added.*'
    commands:
      - runFlow:
          when:
            visible: '.* isn.t responding'
          commands:
            - tapOn:
                id: 'android:id/aerr_close'
                label: Close another app's "isn't responding" dialog
      - runFlow:
          when:
            visible:
              id: '.*password_entry'
          commands:
            - tapOn:
                id: '.*password_entry'
                label: Tap the PIN field
            - inputText: '1234'
            - pressKey: Enter
      - runFlow:
          when:
            visible: 'I agree|Agree'
          commands:
            - tapOn: 'I agree|Agree'
      - runFlow:
          when:
            visible: 'More'
          commands:
            - tapOn: 'More'
      - extendedWaitUntil:
          visible: '(?i).*fingerprint added.*'
          timeout: 3000
          optional: true
          label: Wait for the touches
- assertVisible:
    text: '(?i).*fingerprint added.*'
    label: Android says the fingerprint is added
- runFlow:
    when:
      visible: Done
    commands:
      - tapOn: Done
