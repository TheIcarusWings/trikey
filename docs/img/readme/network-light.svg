<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Your phone and your guardian each connect out to nostr relays, which pass end-to-end encrypted messages between them. The hardware wallet connects to the phone. The guardian reads the chain from your own Bitcoin node." font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
