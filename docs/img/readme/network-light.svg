  <text x="135" y="50" font-size="20" font-weight="650" fill="#09090b">Key 2 · your phone</text>
  <text x="135" y="380" font-size="20" font-weight="650" fill="#09090b">Key 1 · hardware wallet</text>
  <text x="500" y="105" font-size="20" font-weight="650" fill="#09090b">nostr relays</text>
