<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trikey · Someone stole my phone</title>
<link rel="stylesheet" href="../lib/stage.css">
<style>
  .meter { width: 100%; max-width: 920px; display: flex; flex-direction: column; gap: 34px; }
  .meter .bar { height: 96px; border-radius: 20px; background: var(--raise); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .meter .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bad); display: block; }
  .meter .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 40px; }
  .meter .row span { color: var(--muted); }
  .meter .row b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter .row.thief b { color: var(--bad); }
  .meter .chip { align-self: flex-start; margin-top: 20px; display: inline-flex; gap: 18px; align-items: center; font-size: 34px; padding: 22px 30px; border-radius: 18px; background: #422006; color: var(--ink); }
  .meter .chip svg { width: 40px; height: 40px; color: var(--warn); }
  html[data-r="11"] .meter { max-width: 900px; gap: 26px; }
  html[data-r="11"] .meter .row { font-size: 34px; }
  html[data-r="11"] .meter .chip { font-size: 30px; }
  html[data-r="169"] .meter .row { font-size: 36px; }
  html[data-r="169"] .meter .chip { font-size: 30px; }
</style>
</head>
<body>
<script src="../lib/stage.js"></script>
<script>
window.SPEC = {
  id: 'v2-stolen-phone',
  duration: 29.6,
  // Beats were authored on the left-hand times; the right-hand times fit the voiceover.
  retime: [[0, 0], [4.2, 3.4], [8.2, 6.4], [14.6, 12.4], [19.8, 17.5], [27, 25.4], [31, 29.6]],
  music: { seed: 2, chords: 'tense' },
  broll: { name: 'v2-snatch', frames: 150 },
  vo: [
    { at: 0.25, id: 201, text: 'Someone just stole your phone.' },
    { at: 3.6, id: 202, text: 'Say they even get past Face ID.' },
    { at: 6.6, id: 203, text: 'Your guardian only co-signs up to your daily limit. Anything bigger gets refused.' },
    { at: 12.6, id: 204, text: "And raising that limit needs your hardware wallet. Which they don't have." },
    { at: 17.7, id: 205, text: 'So at most, they get your daily limit. Start a recovery with your hardware wallet, and phone payments pause.' },
    { at: 25.7, id: 107, text: 'Trikey. Pre-alpha, and building in public.' },
  ],
};

scaffold();
const caps = captions([
  { a: 0, b: 4.2, main: 'Someone just stole your phone.' },
  { a: 4.2, b: 8.2, main: 'Say they get past Face ID.', sub: 'Balance: 4,210,000 sats.', side: true },
  { a: 8.2, b: 14.6, main: 'Over the daily limit, your guardian won’t co-sign.', sub: 'Only your hardware wallet can. They don’t have it.', side: true },
  { a: 14.6, b: 19.8, main: 'Raising the limit needs your hardware wallet too.', sub: 'Lowering it works from the phone alone.', side: true },
  { a: 19.8, b: 27.0, main: 'At most, they get your daily limit.', sub: 'Then start a recovery with your hardware wallet. Phone-only payments pause.' },
]);

const snatch = broll(SPEC.broll.name);
const home = layer(phone('../../build/screens/Home-dark.png'), 'side');
const hw = layer(phone('../../build/screens/Send-Hardware-dark.png'), 'side');
const limit = layer(phone('../../build/screens/Settings-Limit-dark.png'), 'side');
const meter = layer(`<div class="meter">
  <div class="row"><span>Balance</span><b>4,210,000 sats</b></div>
  <div class="bar"><i></i></div>
  <div class="row thief"><span>A thief’s max today</span><b>200,000</b></div>
  <div class="row"><span>Out of reach</span><b>4,010,000</b></div>
  <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Recovery started · phone-only payments paused</div>
</div>`);

window.update = t => {
  showCaps(caps, t);
  setBroll(snatch, t, 0, 4.2, SPEC.broll.frames);
  show(home, t, 4.2, 8.2, { dy: 60 });
  show(hw, t, 8.2, 14.6, { dy: 60 });
  show(limit, t, 14.6, 19.8, { dy: 60 });

  show(meter, t, 19.8, 27.0, { dy: 40 });
  const rows = meter.querySelectorAll('.row');
  rows.forEach((r, i) => show(r, t, 20.1 + i * 0.5, 27.0, { dy: 16, fo: 0 }));
  $('.bar i', meter).style.width = (200000 / 4210000 * 100 * prog(t, 20.6, 21.6)) + '%';
  show($('.chip', meter), t, 23.6, 27.0, { dy: 20, fo: 0 });

  show($('.mark'), t, 0, 27.0, { fi: 0, dy: 0 });
  endCard(t, 27.0);
};
</script>
</body>
</html>
