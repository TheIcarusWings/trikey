<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trikey setup · Install the guardian on Umbrel</title>
<link rel="stylesheet" href="../lib/stage.css">
<link rel="stylesheet" href="../lib/tutorial.css">
<style>
/* Rings that point at Bitcoin Node and Electrs on the Umbrel home screen (page coordinates). */
.u-ring { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 26px; border: 4px solid #EA580C; opacity: 0; }
</style>
</head>
<body>
<script src="../lib/stage.js"></script>
<script src="../lib/tutorial.js"></script>
<script src="../../build/tut/guardian/timelines.js"></script>
<script src="../../build/tut/umbrel/timelines.js"></script>
<script>
// Footage: the owner's Umbrel (build/tut/umbrel, recorded on their machine; see render/capture/umbrel_mask.py), then
// the guardian's own pages from its mock scenarios (build/tut/guardian). Times below are authored times.
const INSTALL_SPEED = 1.6;                         // the install's wait, sped up
const OPEN_END = 3.35;                             // the open shot stops on the pressed icon, before the guardian's page
const T_HOME = 14, T_STORE = T_HOME + UTL.home.duration, T_INST = T_STORE + UTL.store.duration;
const T_OPEN = T_INST + UTL.install.duration / INSTALL_SPEED;
const G0 = T_OPEN + OPEN_END + 0.25;               // the guardian's setup page
const GSET = G0 + TL.setup.cursor[4].t;            // "Set up" clicked: the pairing page opens
const L0 = GSET + 9.6;                             // after a restart: the locked page
const END = L0 + TL.locked.duration + 0.4;

// SPEC.retime maps authored time to the output ([authored, output] pairs): it stretches each step to fit its
// voiceover line and holds still while the presenter talks. Presenter clips and voiceover lines are in output time;
// the presenter's own audio is the clip's soundtrack (build/tut/vo-proc/80x.wav, taken from the clip).
const PRES = [
  { name: 'tp801', d: 8.05 },   // "Hi! Let's set up the Trikey Guardian…"
  { name: 'tp802', d: 8.05 },    // "One thing to get right: your passphrase…"
  { name: 'tp803', d: 9.05 },   // "That's it, your guardian is ready…"
];
PRES[0].a = 3.0;
const O_HOME = PRES[0].a + PRES[0].d + 0.35 + (T_HOME - 5);      // "Before you start" plays 1:1 after the intro
const O_OPEN = O_HOME + (T_OPEN - T_HOME);
const O_OPEN_END = O_OPEN + 7.8;                                  // the open step, stretched to fit its line
PRES[1].a = O_OPEN_END;
const O_G0 = PRES[1].a + PRES[1].d + 0.1;
const O_GSET = O_G0 + (GSET - G0), O_L0 = O_GSET + (L0 - GSET), O_END = O_L0 + (END - L0);
PRES[2].a = O_END;
window.SPEC = {
  id: 't1-guardian-on-umbrel',
  duration: O_END + PRES[2].d + 5.5,
  retime: [[0, 0], [5, 3], [5, PRES[0].a + PRES[0].d + 0.35], [T_HOME, O_HOME], [T_OPEN, O_OPEN], [G0, O_OPEN_END],
    [G0, O_G0], [GSET, O_GSET], [L0, O_L0], [END - 0.01, O_END], [END - 0.01, O_END + PRES[2].d + 0.1],
    [END + 1, O_END + PRES[2].d + 1.1]],
  vo: [
    [PRES[0].a, 801], [PRES[0].a + PRES[0].d + 0.6, 811], [O_HOME + 0.4, 812], [O_HOME + (T_INST - T_HOME) + 0.4, 813],
    [O_OPEN + 0.3, 814], [PRES[1].a, 802], [O_G0 + 0.5, 815], [O_GSET + 0.6, 816], [O_L0 + 0.5, 817], [PRES[2].a, 803],
  ].map(([at, id]) => ({ at, id })),
};

const STORE = 'github.com/TheIcarusWings/trikey-umbrel-store';
const U = '../../build/tut/umbrel', G = '../../build/tut/guardian';
const uHome = recorded(`${U}/home`, UTL.home);
uHome.insertAdjacentHTML('beforeend', '<div class="u-ring" style="left:564px; top:414px"></div><div class="u-ring" style="left:864px; top:414px"></div>');
const uStore = recorded(`${U}/store`, UTL.store);
const uInstall = recorded(`${U}/install`, UTL.install, INSTALL_SPEED);
const uOpen = recorded(`${U}/open`, UTL.open);
const gSetup = recorded(`${G}/setup`, TL.setup);
const gLocked = recorded(`${G}/locked`, TL.locked);
const SHOTS = [
  { a: 5, b: T_HOME, el: uHome, at: () => 0 },
  { a: T_HOME, b: T_STORE, el: uHome, at: t => t - T_HOME },
  { a: T_STORE, b: T_INST, el: uStore, at: t => t - T_STORE },
  { a: T_INST, b: T_OPEN, el: uInstall, at: t => t - T_INST },
  { a: T_OPEN, b: G0, el: uOpen, at: t => Math.min(t - T_OPEN, OPEN_END - 0.01) },
  { a: G0, b: L0, el: gSetup, at: t => t - G0 },
  { a: L0, b: 1e9, el: gLocked, at: t => t - L0 },
];

const update = tutorial({
  series: 'Setup · 1 of 6',
  title: 'Install the guardian on Umbrel',
  address: t => (t < G0 - 0.2 ? 'umbrel.local' : 'umbrel.local · Trikey Guardian'),
  scenes: [
    { a: 5, b: T_STORE + 0.2, el: uHome },
    { a: T_STORE, b: T_INST + 0.2, el: uStore },
    { a: T_INST, b: T_OPEN + 0.2, el: uInstall },
    { a: T_OPEN, b: G0 + 0.2, el: uOpen },
    { a: G0, b: L0 + 0.2, el: gSetup },
    { a: L0, b: 1e9, el: gLocked },
  ],
  cursor: [
    ...shiftCursor(UTL.home, T_HOME),
    ...shiftCursor(UTL.store, T_STORE).slice(1),
    ...shiftCursor(UTL.install, T_INST, INSTALL_SPEED).slice(1),
    // The open shot's own cursor track points off-page; these follow its frames: next page, then the icon.
    { t: T_OPEN + 2.6, x: 1128, y: 388, click: true },
    { t: T_OPEN + 3.25, x: 566, y: 470, click: true },
    { t: G0 - 0.01, x: null },
    ...shiftCursor(TL.setup, G0),
    { t: L0 - 0.01, x: null },
    ...shiftCursor(TL.locked, L0),
  ],
  zoom: [
    { t: T_STORE + 9.0, s: 1, x: 640, y: 400 }, { t: T_STORE + 9.9, s: 1.45, x: 720, y: 300 },
    { t: T_STORE + 18.6, s: 1.45, x: 720, y: 300 }, { t: T_INST + 0.4, s: 1, x: 640, y: 400 },
    { t: G0 + 2.6, s: 1, x: 640, y: 400 }, { t: G0 + 3.5, s: 1.4, x: 640, y: 520 },
    { t: G0 + 9.2, s: 1.4, x: 640, y: 520 }, { t: G0 + 10.1, s: 1, x: 640, y: 400 },
    { t: GSET + 1.0, s: 1, x: 640, y: 400 }, { t: GSET + 1.9, s: 1.2, x: 700, y: 250 },
    { t: L0 - 0.6, s: 1.2, x: 700, y: 250 }, { t: L0, s: 1, x: 640, y: 400 },
    { t: L0 + 5.4, s: 1, x: 640, y: 400 }, { t: L0 + 6.3, s: 1.35, x: 640, y: 560 },
    { t: L0 + 8.9, s: 1.35, x: 640, y: 560 }, { t: L0 + 9.8, s: 1, x: 640, y: 400 },
  ],
  steps: [
    { a: 5, b: T_HOME, n: 'i', title: 'Before you start', html: `<ul>
        <li><b>An Umbrel</b> with Bitcoin Node and Electrs.</li>
        <li>Both on <b>the network you'll test on</b>. Signet is the easiest: its coins have no value.</li>
        <li><b>Electrs fully synced.</b> On a new install that can take a day or more.</li></ul>` },
    { a: T_HOME, b: T_INST, n: 1, title: 'Add the Trikey app store',
      html: `<p>In the App Store, open the <b>···</b> menu, then <b>Community App Stores</b>, and add:</p><span class="mono">${STORE}</span>`,
      notes: [{ a: T_STORE + 6, html: '<b>Paste it, don’t type it.</b> A typo shows “401 Unauthorized”.', y: 430 }] },
    { a: T_INST, b: T_OPEN, n: 2, title: 'Install Trikey Guardian',
      html: '<p>Open the Trikey store and install <b>Trikey Guardian</b>.</p>',
      notes: [{ a: T_INST + 3, html: 'It needs Bitcoin Node and Electrs. Umbrel installs them too if they’re missing.', tip: true, y: 250 }] },
    { a: T_OPEN, b: G0, n: 3, title: 'Open it from the home screen',
      html: '<p>Click its icon on your Umbrel’s home screen.</p>',
      notes: [{ a: T_OPEN + 0.8, html: '<b>Always open it this way</b>, not by typing an address and port. The icon goes through Umbrel’s login; the guardian has no password of its own.', y: 300 }] },
    { a: G0, b: GSET, n: 4, title: 'Choose a passphrase',
      html: '<p>It unlocks the guardian after every restart. <b>There’s no way to reset it</b>, so write it down and keep it safe.</p>',
      notes: [
        { a: G0 + 1.5, b: G0 + 10.2, html: 'The green check means it found your node and Electrs. If setup won’t go ahead, Electrs is still syncing or on another network.', tip: true, y: 300 },
        { a: G0 + 10.4, html: '<b>Relays</b> are how your phone reaches the guardian. Leave the defaults unless you know you need others.', tip: true, y: 300 },
      ] },
    { a: GSET, b: L0, n: 5, title: 'Your guardian is ready',
      html: '<p>It opens on a pairing code. You’ll scan one with the Trikey app when you create your wallet (video 3).</p>',
      notes: [{ a: GSET + 2, html: 'Codes expire after a few minutes. Make a new one when your phone is ready to scan.', tip: true, y: 330 }] },
    { a: L0, b: END, n: 6, title: 'After a restart, unlock it',
      html: '<p>Every restart locks key 3, so a stolen box is useless until it’s unlocked.</p>',
      notes: [{ a: L0 + 2.5, html: 'Unlock it from the Trikey app with your hardware wallet (recommended), or type your passphrase here.', tip: true, y: 300 }] },
  ],
  chapters: [
    { a: 5, label: 'Before you start' }, { a: T_HOME, label: 'Add the store' }, { a: T_INST, label: 'Install' },
    { a: T_OPEN, label: 'Open' }, { a: G0, label: 'Passphrase' }, { a: GSET, label: 'Ready' }, { a: L0, label: 'Unlock' },
  ],
  intro: [0, 5],
  outro: { at: END, next: 'Install the app' },
});

// The presenter, in output time: over the window, with the step panel hidden.
const pres = h('div', { class: 't-pres' }, '<span class="ai">AI avatar of the founder</span>');
$('#stage').append(pres);
for (const p of PRES) p.el = clip(p.name, pres);
window.seek = async t => {
  window.update(remap(t));
  let e = 0;
  for (const p of PRES) e = Math.max(e, setClip(p.el, t, p.a, p.a + p.d, { frames: Math.round(p.d * 30), fi: 0.3, fo: 0.3 }));
  pres.style.opacity = e;
  $('.t-panel').style.opacity = 1 - e;
  await Promise.all(pending.splice(0));
};

window.update = t => {
  update(t);
  const ring = env(t, 6.5, 13.5, 0.4, 0.4);
  uHome.querySelectorAll('.u-ring').forEach(r => (r.style.opacity = ring));
  for (const s of SHOTS) if (t >= s.a && t < s.b) s.el.at(s.at(t));
};
</script>
</body>
</html>
