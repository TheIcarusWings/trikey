<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trikey · Three keys. No company.</title>
<link rel="stylesheet" href="../lib/stage.css">
<style>
  .tri { width: 100%; height: 100%; }
  .tri text { font-family: 'Geist', sans-serif; fill: var(--ink); }
  .tri .k { font-family: 'Geist Mono', monospace; fill: var(--dim); font-size: 26px; letter-spacing: 0.08em; }
  .tri .lbl { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; }
  .tri .edge { stroke: var(--ink); stroke-width: 10; stroke-linecap: round; fill: none; }
  .tri .node { fill: var(--raise); stroke: var(--line); stroke-width: 3; }
  .tri .ico { stroke: var(--ink); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .code { width: 100%; max-width: 900px; border: 1px solid var(--line); border-radius: 24px; background: var(--raise); padding: 44px 48px; font-size: 40px; line-height: 1.6; color: var(--muted); white-space: pre; }
  html[data-r="11"] .code { font-size: 30px; padding: 34px 36px; }
  html[data-r="169"] .code { font-size: 34px; }
  .code b { color: var(--ink); font-weight: 500; }
  .code .cur { display: inline-block; width: 0.55em; height: 1.1em; vertical-align: -0.2em; background: var(--ink); }
  .ok { position: absolute; left: 7%; right: 7%; bottom: 13%; padding: 3.2cqw 4cqw; border-radius: 3cqw; background: #052E16; color: var(--good);
        font-size: 3.6cqw; font-weight: 500; display: flex; gap: 2.4cqw; align-items: center; opacity: 0; }
</style>
</head>
<body>
<script src="../lib/stage.js"></script>
<script>
window.SPEC = {
  id: 'v1-three-keys',
  duration: 35.4,
  // Beats were authored on the left-hand times; the right-hand times fit the voiceover.
  retime: [[0, 0], [4.4, 5.4], [10.2, 12.6], [13.4, 15.6], [19, 20.6], [24, 25.6], [29, 31.2], [33, 35.4]],
  music: { seed: 1, chords: 'bright' },
  vo: [
    { at: 0.25, id: 101, text: 'A Bitkey-style bitcoin wallet. Except no company holds a key.' },
    { at: 5.6, id: 102, text: 'Three keys, all yours: a hardware wallet, your phone, and your own home server.' },
    { at: 12.8, id: 103, text: 'Any two of them move your money.' },
    { at: 15.8, id: 104, text: 'Everyday payments use your phone and your guardian, up to a daily limit.' },
    { at: 20.8, id: 105, text: 'Big payments and rule changes need your hardware wallet.' },
    { at: 25.8, id: 106, text: "It's plain multisig, so any wallet can recover it. Even without Trikey." },
    { at: 31.5, id: 107, text: 'Trikey. Pre-alpha, and building in public.' },
  ],
};

scaffold();
const caps = captions([
  { a: 0, b: 4.4, main: 'A Bitkey-style bitcoin wallet.', sub: 'Except no company holds a key.' },
  { a: 4.4, b: 10.2, main: 'Three keys. <br>All yours.' },
  { a: 10.2, b: 13.4, main: 'Any two keys <br>move money.' },
  { a: 13.4, b: 19.0, main: 'Everyday: your phone + your guardian.', sub: 'Face ID only, up to a daily limit your guardian enforces.', side: true },
  { a: 19.0, b: 24.0, main: 'Big payments and new rules need your hardware wallet.', sub: 'So a stolen phone can’t loosen them.', side: true },
  { a: 24.0, b: 29.0, main: 'Plain multisig.', sub: 'Any multisig wallet can recover it. Even without Trikey.' },
]);

// Corners: hardware (top), phone (bottom left), guardian (bottom right).
const C = { hw: [500, 190], ph: [190, 700], gd: [810, 700] };
const ICONS = {
  hw: '<rect x="6" y="2" width="12" height="20" rx="2"/><rect x="9" y="5" width="6" height="5" rx="0.5"/><circle cx="12" cy="16" r="1.6"/>',
  ph: '<rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18.5h2"/>',
  gd: '<rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/>',
};
const LABEL = { hw: ['KEY 1', 'Hardware wallet'], ph: ['KEY 2', 'Your phone'], gd: ['KEY 3', 'Your home server'] };
const EDGES = [['hw', 'ph'], ['ph', 'gd'], ['gd', 'hw']];

const tri = layer(`<svg class="tri" viewBox="0 0 1000 980">
  ${EDGES.map(([a, b], i) => `<line class="edge" id="e${i}" x1="${C[a][0]}" y1="${C[a][1]}" x2="${C[b][0]}" y2="${C[b][1]}"/>`).join('')}
  ${Object.entries(C).map(([k, [x, y]]) => `
    <g id="n-${k}">
      <circle class="node" cx="${x}" cy="${y}" r="92"/>
      <g class="ico" transform="translate(${x - 48} ${y - 48}) scale(4)">${ICONS[k]}</g>
      <text class="k" x="${x}" y="${k === 'hw' ? y - 160 : y + 150}" text-anchor="middle">${LABEL[k][0]}</text>
      <text class="lbl" x="${x}" y="${k === 'hw' ? y - 116 : y + 202}" text-anchor="middle">${LABEL[k][1]}</text>
    </g>`).join('')}
</svg>`);
const edges = EDGES.map((_, i) => $('#e' + i));
edges.forEach(e => { const L = e.getTotalLength(); e.style.strokeDasharray = L; e.dataset.L = L; });
const nodes = Object.fromEntries(Object.keys(C).map(k => [k, $('#n-' + k)]));

const send = layer(phone('../../build/screens/Send-Review-dark.png',
  `<div class="ov ok"><svg width="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>Signed by phone + guardian</div>`), 'side');
const limit = layer(phone('../../build/screens/Settings-Limit-dark.png'), 'side');
const DESC = [
  ['<b>wsh</b>(<b>sortedmulti</b>(<b>2</b>,'],
  ['  [hardware]xpub6Ea…f3/<0;1>/*,'],
  ['  [phone]xpub6Fq…9c/<0;1>/*,'],
  ['  [guardian]xpub6Dk…2a/<0;1>/*))'],
];
const code = layer(`<div class="code mono"></div>`);

window.update = t => {
  showCaps(caps, t);
  // The hook's second line lands a beat after the first.
  show(caps[0].el.querySelector('.sub'), t, 0.5, 4.4, { fi: 0.4, fo: 0, dy: 16 });

  // Triangle: B1 faint preview → B2 draw → B3 pairs.
  const te = show(tri, t, 0, 13.4, { fi: 0, fo: 0.4, dy: 0 });
  if (te > 0) {
    const pre = t < 4.4 ? 0.18 : 1;
    edges.forEach((e, i) => {
      const d = t < 4.4 ? 1 : prog(t, 4.6 + i * 0.5, 5.6 + i * 0.5, easeIO);
      e.style.strokeDashoffset = e.dataset.L * (1 - d);
    });
    Object.entries(nodes).forEach(([k, n], i) => {
      const a = t < 4.4 ? 1 : prog(t, 5.6 + i * 0.7, 6.3 + i * 0.7);
      n.style.opacity = t < 4.4 ? pre : a;
      n.style.transform = `translateY(${(1 - a) * 20}px)`;
    });
    edges.forEach(e => (e.style.opacity = t < 4.4 ? pre : 1));
    if (t >= 10.2) {
      // Cycle the three pairs: each pair lights its edge and two nodes.
      const i = Math.min(2, Math.floor((t - 10.2) / 1.05));
      const [a, b] = EDGES[i];
      edges.forEach((e, j) => (e.style.opacity = j === i ? 1 : 0.15));
      Object.entries(nodes).forEach(([k, n]) => (n.style.opacity = k === a || k === b ? 1 : 0.25));
    }
  }

  show(send, t, 13.4, 19.0, { dy: 60 });
  show($('.ok', send), t, 15.6, 19.0, { dy: 30, fi: 0.35 });
  show(limit, t, 19.0, 24.0, { dy: 60 });

  // Descriptor types itself in.
  show(code, t, 24.0, 29.0, { dy: 40 });
  const full = DESC.map(l => l[0]).join('\n');
  const plain = full.replace(/<[^>]+>/g, '');
  const n = Math.floor(clamp((t - 24.3) / 2.4) * plain.length);
  let out = '', seen = 0;
  for (let i = 0; i < full.length && seen < n; i++) {
    if (full[i] === '<') { const j = full.indexOf('>', i); out += full.slice(i, j + 1); i = j; continue; }
    out += full[i]; seen++;
  }
  if (out.split('<b>').length > out.split('</b>').length) out += '</b>';
  $('.code').innerHTML = out + (n < plain.length || Math.floor(t * 2) % 2 ? '<span class="cur"></span>' : '');

  show($('.mark'), t, 0, 29.0, { fi: 0, dy: 0 });
  endCard(t, 29.0);
};
</script>
</body>
</html>
