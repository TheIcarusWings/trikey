<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trikey · Lost my phone: Delay &amp; Notify</title>
<link rel="stylesheet" href="../lib/stage.css">
<style>
  .tl { width: 100%; max-width: 940px; position: relative; }
  .tl svg { width: 100%; display: block; overflow: visible; }
  .tl text { font-family: 'Geist', sans-serif; fill: var(--muted); }
  .tl .day { font-size: 26px; text-anchor: middle; }
  .tl .who { font-size: 30px; fill: var(--ink); }
  .tl .opt { font-family: 'Geist Mono', monospace; font-size: 26px; fill: var(--dim); }
  .tl .opt tspan.on { fill: var(--ink); }
  .big { font-size: 96px; font-weight: 600; letter-spacing: -0.035em; line-height: 1.08; text-align: left; width: 100%; padding: 0 20px; }
  .big span { display: block; }
  html[data-r="11"] .big { font-size: 80px; }
  html[data-r="169"] .big { font-size: 88px; }
  .solo { position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; opacity: 0; }
  html[data-r="916"] .solo { padding: 0 84px; }
  html[data-r="11"] .solo { padding: 0 72px; }
  html[data-r="169"] .solo { padding: 0 130px; }
</style>
</head>
<body>
<script src="../lib/stage.js"></script>
<script>
window.SPEC = {
  id: 'v3-lost-phone',
  duration: 32.6,
  // Beats were authored on the left-hand times; the right-hand times fit the voiceover.
  retime: [[0, 0], [4, 3.6], [9.6, 8.0], [17, 14.0], [24, 19.6], [29.6, 24.6], [33.6, 28.6], [37.6, 32.6]],
  music: { seed: 3, chords: 'calm' },
  broll: { name: 'v3-train', frames: 150 },
  vo: [
    { at: 0.25, id: 301, text: 'Lost your phone? And the backup with it?' },
    { at: 3.8, id: 302, text: 'Your hardware wallet and your guardian start a recovery.' },
    { at: 8.2, id: 303, text: 'It waits seven days, and alerts you and your contacts every day.' },
    { at: 14.2, id: 304, text: 'If someone else started it, any of your devices or contacts can cancel it.' },
    { at: 19.8, id: 305, text: 'If nobody cancels, your guardian co-signs the move to your new wallet.' },
    { at: 24.8, id: 306, text: 'Your server. Your contacts. No support ticket.' },
    { at: 28.9, id: 107, text: 'Trikey. Pre-alpha, and building in public.' },
  ],
};

scaffold('One key gone. Your bitcoin isn’t.');
const caps = captions([
  { a: 0, b: 4.0, main: 'Lost your phone?', sub: 'And the backup with it?' },
  { a: 4.0, b: 9.6, main: 'Your hardware wallet + your guardian start a recovery.', sub: 'The guardian runs on your own Umbrel or Start9.' },
  { a: 9.6, b: 17.0, main: 'Then it waits 7 days.', sub: 'Every day, you and your contacts get an alert.' },
  { a: 17.0, b: 24.0, main: 'Didn’t start it? Cancel.', sub: 'Any of your devices or contacts can stop a fake recovery.', side: true },
  { a: 24.0, b: 29.6, main: 'Nobody cancels? Your guardian co-signs on day 7.', sub: 'Your money moves to a new wallet the lost phone can’t touch.', side: true },
]);

const train = broll(SPEC.broll.name);
const guardian = layer(`<div class="browser"><div class="bar"><i></i><i></i><i></i><span>umbrel.local · Trikey Guardian</span></div><div class="crop"><img src="../../build/screens/Guardian-Recovery-dark.png"></div></div>`);

// Timeline: 8 day ticks, daily pings to three recipients.
const WHO = ['Your old phone', 'Maria', 'Tom'];
const X0 = 60, X1 = 900, DX = (X1 - X0) / 7;
const tl = layer(`<div class="tl"><svg viewBox="0 0 960 520">
  <text class="opt" x="${X0}" y="40">DELAY <tspan class="on">7</tspan> · 14 · 30 DAYS</text>
  <line x1="${X0}" y1="120" x2="${X1}" y2="120" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>
  <line id="prog" x1="${X0}" y1="120" x2="${X0}" y2="120" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
  ${[...Array(8)].map((_, d) => `<circle cx="${X0 + d * DX}" cy="120" r="12" fill="var(--raise)" stroke="var(--line)" stroke-width="3" id="d${d}"/>
     <text class="day" x="${X0 + d * DX}" y="178">${d === 0 ? 'Start' : 'Day ' + d}</text>`).join('')}
  ${WHO.map((w, r) => `<text class="who" x="${X0}" y="${246 + r * 92}">${w}</text>
     ${[...Array(7)].map((_, d) => `<circle class="ping" data-d="${d}" cx="${X0 + (d + 1) * DX}" cy="${278 + r * 92}" r="13" fill="var(--warn)"/>`).join('')}`).join('')}
  <line x1="${X0 + 7 * DX}" y1="200" x2="${X0 + 7 * DX}" y2="490" stroke="var(--line)" stroke-dasharray="6 8" stroke-width="3"/>
</svg></div>`);
const pings = [...tl.querySelectorAll('.ping')];

const alert = layer(phone('../../build/screens/Recover-Alert-dark.png', `<div class="tap" style="left:50%; top:84.1%"></div>`), 'side');
const done = layer(phone('../../build/screens/Recover-Done-dark.png'), 'side');
const solo = h('div', { class: 'solo' }, `<div class="big"><span>Your server.</span><span>Your contacts.</span><span>No support ticket.</span></div>`);
$('#stage').append(solo);

window.update = t => {
  showCaps(caps, t);
  setBroll(train, t, 0, 4.0, SPEC.broll.frames);
  show(guardian, t, 4.0, 9.6, { dy: 50 });

  show(tl, t, 9.6, 17.0, { dy: 40 });
  const p = prog(t, 10.2, 15.8, x => x);
  $('#prog').setAttribute('x2', X0 + (X1 - X0) * p);
  for (let d = 0; d < 8; d++) $('#d' + d).setAttribute('fill', p * 7 >= d - 0.001 ? 'var(--ink)' : 'var(--raise)');
  // One alert per recipient lands with each day.
  pings.forEach(c => {
    const d = +c.dataset.d;
    const at = 10.2 + (d + 1) * (5.6 / 7);
    const e = prog(t, at - 0.05, at + 0.25);
    c.setAttribute('r', 13 * e + (e > 0 && e < 1 ? 6 * Math.sin(e * Math.PI) : 0));
    c.style.opacity = e;
  });
  tl.querySelectorAll('.who').forEach((w, r) => (w.style.opacity = prog(t, 10.0 + r * 0.15, 10.5 + r * 0.15)));

  show(alert, t, 17.0, 24.0, { dy: 60 });
  const tap = $('.tap', alert);
  const te = env(t, 21.4, 22.2, 0.12, 0.35);
  tap.style.opacity = te;
  tap.style.transform = `translate(-50%, -50%) scale(${0.6 + 0.6 * prog(t, 21.4, 22.2)})`;

  show(done, t, 24.0, 29.6, { dy: 60 });

  show(solo, t, 29.6, 33.6, { dy: 0, fi: 0.3, fo: 0.4 });
  solo.querySelectorAll('span').forEach((s, i) => show(s, t, 29.7 + i * 0.75, 33.6, { dy: 24, fo: 0 }));

  show($('.mark'), t, 0, 33.6, { fi: 0, dy: 0 });
  endCard(t, 33.6);
};
</script>
</body>
</html>
