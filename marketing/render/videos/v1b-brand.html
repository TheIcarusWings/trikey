<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trikey · Three keys (brand cut)</title>
<link rel="stylesheet" href="../lib/stage.css">
<style>
  /* Brand cut: light ground, the logo is the only visual. */
  :root { --ink: #09090B; --muted: #71717A; --dim: #A1A1AA; --ground: #F4F4F5; --raise: #FFFFFF; --line: #E4E4E7; --brand: #EA580C; }
  .mark { display: none; }
  .cap { align-items: center; text-align: center; }
  .cap .main { letter-spacing: -0.035em; }
  html[data-r="916"] .caps { left: 70px; right: 70px; top: 330px; height: 470px; }
  html[data-r="916"] .cap .main { font-size: 96px; }
  html[data-r="916"] .vis { left: 90px; right: 90px; top: 860px; bottom: 260px; }
  html[data-r="11"] .cap { top: 70px; height: 290px; }
  html[data-r="11"] .cap .main { font-size: 68px; }
  html[data-r="11"] .layer { top: 400px; bottom: 70px; }
  html[data-r="169"] .caps { left: 160px; right: 160px; width: auto; top: 90px; bottom: auto; height: 260px; }
  html[data-r="169"] .cap { justify-content: flex-end; }
  html[data-r="169"] .cap .main { font-size: 80px; }
  html[data-r="169"] .vis { left: 560px; right: 560px; top: 400px; bottom: 70px; }
  .art { width: 100%; height: 100%; overflow: visible; }
  .art text { font-family: 'Geist', sans-serif; font-size: 44px; font-weight: 500; fill: var(--muted); text-anchor: middle; letter-spacing: -0.01em; }
</style>
</head>
<body>
<script src="../lib/stage.js"></script>
<script>
window.SPEC = {
  id: 'v1b-brand',
  duration: 25,
  music: { seed: 4, chords: 'bright' },
  vo: [],
};

scaffold();
$('.end .status').innerHTML = '<b></b>Coming soon · pre-alpha, not audited';

const caps = captions([
  { a: 0, b: 3.4, main: 'A bitcoin wallet where no company holds a key.' },
  { a: 3.4, b: 6.6, main: 'Three keys.' },
  { a: 6.6, b: 9.8, main: 'All of them yours.' },
  { a: 9.8, b: 13.2, main: 'Any two move your money.' },
  { a: 13.2, b: 16.8, main: 'Lose one? <br>You still have the other two.' },
  { a: 16.8, b: 20.0, main: 'Feels like Bitkey. <br>Nobody in the middle.' },
]);

// The logo, scaled up: same proportions as the 88×80 mark (side 56, dot r 12, stroke 6).
const K = 10, OX = 60, OY = 40;
const PTS = { hw: [44, 14], ph: [16, 62], gd: [72, 62] };
const at = ([x, y]) => [OX + x * K, OY + y * K];
const SCATTER = { hw: [520, 120], ph: [170, 500], gd: [760, 760] };
const LABEL = { hw: ['Hardware wallet', 0, -170], ph: ['Phone', 0, 205], gd: ['Home server', 0, 205] };
const EDGES = [['hw', 'ph'], ['ph', 'gd'], ['gd', 'hw']];

const art = layer(`<svg class="art" viewBox="0 0 1000 900">
  ${EDGES.map(([a, b], i) => { const [x1, y1] = at(PTS[a]), [x2, y2] = at(PTS[b]);
    return `<line id="e${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--ink)" stroke-width="${6 * K}" stroke-linecap="round"/>`; }).join('')}
  ${Object.keys(PTS).map(k => `<circle id="c-${k}" r="${12 * K}" fill="var(--ink)"/>
    <text id="t-${k}">${LABEL[k][0]}</text>`).join('')}
</svg>`);
const edges = EDGES.map((_, i) => $('#e' + i));
edges.forEach(e => { const L = Math.hypot(e.x2.baseVal.value - e.x1.baseVal.value, e.y2.baseVal.value - e.y1.baseVal.value); e.dataset.L = L; e.style.strokeDasharray = L; });

const mix = (a, b, p) => a.map((v, i) => lerp(v, b[i], p));
const ORANGE = [234, 88, 12], INK = [9, 9, 11];

window.update = t => {
  showCaps(caps, t);
  show(art, t, 0, 20.0, { fi: 0, fo: 0.6, dy: 0 });

  // Dots drift in, then settle into the triangle.
  const settle = prog(t, 3.4, 5.4, easeIO);
  for (const k of Object.keys(PTS)) {
    const drift = [Math.sin(t * 0.9 + k.length) * 14, Math.cos(t * 0.7 + k.length) * 14];
    const [x, y] = mix(SCATTER[k].map((v, i) => v + drift[i] * (1 - settle)), at(PTS[k]), settle);
    const c = $('#c-' + k);
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.style.opacity = prog(t, 0, 1.2) * (t < 3.4 ? 0.9 : 1);
    const lbl = $('#t-' + k);
    lbl.setAttribute('x', x + LABEL[k][1]); lbl.setAttribute('y', y + LABEL[k][2] + 15);
    lbl.style.opacity = env(t, 5.0, 9.8, 0.6, 0.5);
  }

  // Lines draw; the top dot warms to the brand orange.
  edges.forEach((e, i) => (e.style.strokeDashoffset = e.dataset.L * (1 - prog(t, 6.7 + i * 0.35, 7.9 + i * 0.35, easeIO))));
  const warm = prog(t, 8.0, 9.0);
  $('#c-hw').setAttribute('fill', `rgb(${mix(INK, ORANGE, warm).join(',')})`);

  // Any two: light one pair at a time, dim the third dot and its edges.
  const dim = (k, v) => ($('#c-' + k).style.opacity = v);
  if (t >= 9.8 && t < 13.2) {
    const i = Math.min(2, Math.floor((t - 10.0) / 1.05));
    const [a, b] = EDGES[Math.max(0, i)];
    edges.forEach((e, j) => (e.style.opacity = j === Math.max(0, i) ? 1 : 0.12));
    for (const k of Object.keys(PTS)) dim(k, k === a || k === b ? 1 : 0.15);
  } else if (t >= 13.2 && t < 16.8) {
    // Lose one: the phone fades out, the other two and their edge stay.
    const gone = prog(t, 13.5, 14.3);
    edges.forEach((e, j) => (e.style.opacity = j === 2 ? 1 : 1 - 0.88 * gone));
    dim('ph', 1 - 0.85 * gone);
    dim('hw', 1); dim('gd', 1);
  } else {
    edges.forEach(e => (e.style.opacity = 1));
  }

  // Feels like Bitkey: the full logo returns and breathes.
  const s = t >= 16.8 ? 1 + 0.03 * Math.sin((t - 16.8) * 1.8) : 1;
  $('.art').style.transform = `scale(${s})`;

  endCard(t, 20.0);
};
</script>
</body>
</html>
